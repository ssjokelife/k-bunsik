<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  #top { position:fixed; top:0; left:0; right:0; padding:8px 12px;

  #next::-webkit-scrollbar { height:0; }

  #next .card.cur { border-color:#ffd08a; background:#2a2418; }
  #next .card.done { opacity:.32; cursor:default; }
  #bottom { position:fixed; bottom:0; left:0; right:0; padding:9px; display:flex; gap:8px;

  #hint { position:fixed; bottom:98px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); border-radius:10px; padding:5px 13px; font-size:12px;

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none;

  #stageSelect { position:fixed; inset:0; background:linear-gradient(#141820,#1a2230); z-index:30;

  .stg { background:#1b1e27; border:2px solid #2a3140; border-radius:12px; padding:12px 15px;
    margin:8px auto; max-width:450px; width:100%; cursor:pointer; }
  .stg.clr { border-color:#3a7a4a; } .stg.cur { border-color:#ecc94b; box-shadow:0 0 14px rgba(236,201,75,.3); }
  .stg.lock { opacity:.4; cursor:default; }
  .stg .sh { font-size:15px; font-weight:bold; color:#dde; }
  .stg .sc { font-size:12px; color:#8fb8e8; font-weight:normal; }
  .stg .sw { font-size:12.5px; color:#aab; margin-top:3px; }
  .stg .sf { font-size:12px; color:#889; margin-top:4px; }
</style>

<canvas id="c"></canvas>
<div id="top">

<script type="module">
import * as THREE from 'three';

// ═══ 컨테이너 타입 (ISO 실측·격자가 내부를 꽉 채운다) ═══
const CONTAINERS = {
  '20gp': { name:'20ft 일반',     L:5.90,  W:2.35, H:2.39, cw:8,  cd:3, ch:3, icon:'🟦', desc:'가장 흔한 표준 · 33 CBM', thc:20 },
  '40gp': { name:'40ft 일반',     L:12.03, W:2.35, H:2.39, cw:16, cd:3, ch:3, icon:'🟩', desc:'길이 2배 · 67 CBM', thc:34 },
  '40hc': { name:'40ft 하이큐브', L:12.03, W:2.35, H:2.69, cw:16, cd:3, ch:4, icon:'🟪', desc:'천장 30cm↑ · 76 CBM', thc:38 },
  '20rf': { name:'20ft 냉동',     L:5.44,  W:2.29, H:2.27, cw:7,  cd:3, ch:3, icon:'❄️', desc:'단열벽 · 용적↓ · 28 CBM', reefer:true, thc:28 },
};
let curCon='20gp';
let CON, CW, CD, CH, CELLX, CELLY, CELLZ, CELLV, OX, OZ;
function applyContainerSpec(id){
  const s=CONTAINERS[id]; curCon=id;
  CON={L:s.L,W:s.W,H:s.H}; CW=s.cw; CD=s.cd; CH=s.ch;
  CELLX=CON.L/CW; CELLY=CON.H/CH; CELLZ=CON.W/CD; CELLV=CELLX*CELLY*CELLZ;
  OX=-CON.L/2; OZ=-CON.W/2;
}
applyContainerSpec('20gp');
const cbmOf = cells => Math.round(cells*CELLV*10)/10;

// ═══ 화물 종류 (실물 규격·상태 — 칸 단위 w×d×h) ═══
const TYPES = {
  carton:  { w:1,d:1,h:1, wt:0.3, color:0xc8a878, name:'카톤박스',   icon:'📦', status:'일반',      desc:'일반 골판지 박스' },
  pallet:  { w:2,d:1,h:2, wt:0.6, color:0xcaa060, name:'팔레트화물', icon:'🟫', status:'일반',      desc:'유로파렛트 적재·랩핑' },
  drum:    { w:1,d:1,h:1, wt:0.2, color:0x2f66b0, name:'드럼통',     icon:'🛢', status:'위험물',    desc:'200L 화학 드럼 · 세워서', hazmat:true, upright:true },
  ibc:     { w:2,d:1,h:2, wt:1.1, color:0xd0d4dc, name:'IBC탱크',    icon:'🧴', status:'액체·중량', desc:'1000L 케이지 탱크', heavy:true, upright:true },
  bigbag:  { w:1,d:1,h:2, wt:0.9, color:0xd8c890, name:'톤백',       icon:'🛍', status:'분체',      desc:'1톤 곡물·모래 자루' },
  crate:   { w:2,d:2,h:1, wt:0.7, color:0x9a7a4a, name:'목상자',     icon:'🪵', status:'일반',      desc:'목재 크레이트' },
  pipe:    { w:3,d:1,h:1, wt:1.4, color:0x8a8a92, name:'강관번들',   icon:'⛓', status:'중량·장척', desc:'강관 다발', heavy:true },
  glass:   { w:1,d:1,h:2, wt:0.5, color:0x88c0d0, name:'판유리',     icon:'⚠️', status:'깨짐주의',  desc:'A프레임 판유리 · 상단금지', fragile:true },
  machine: { w:2,d:2,h:2, wt:3.2, color:0x6a6e78, name:'기계장비',   icon:'⚙️', status:'초중량',    desc:'팔레트 위 기계', heavy:true },
  frozen:  { w:1,d:1,h:1, wt:0.4, color:0x9ad0e8, name:'냉동식품',   icon:'❄️', status:'냉동유지',  desc:'냉동육·수산 박스 (-18℃)', frozen:true },
  produce: { w:2,d:1,h:2, wt:0.5, color:0x8ad090, name:'청과팔레트', icon:'🥬', status:'냉장유지',  desc:'과일·채소 팔레트 (+4℃)', chilled:true },
};
// 컨테이너별 화물 목록 (크기에 비례 · 냉동엔 냉동화물). 총 칸수 > 컨테이너 → 다 못 넣음
const MANIFESTS = {
  '20gp': ['machine','ibc','pallet','pallet','crate','pipe','pipe','bigbag','bigbag','glass','glass','drum','drum','drum','carton','carton','carton','carton'],
  '40gp': ['machine','machine','ibc','ibc','pallet','pallet','pallet','crate','crate','pipe','pipe','bigbag','bigbag','bigbag','glass','glass','drum','drum','drum','drum','carton','carton','carton','carton','carton','carton'],
  '40hc': ['machine','machine','ibc','ibc','ibc','pallet','pallet','pallet','pallet','crate','crate','pipe','pipe','pipe','bigbag','bigbag','bigbag','glass','glass','glass','drum','drum','drum','drum','carton','carton','carton','carton','carton','carton','carton','carton'],
  '20rf': ['produce','produce','produce','produce','frozen','frozen','frozen','frozen','frozen','frozen','frozen','carton','carton','produce','frozen','carton'],
};
let INV = [], nextId = 0;
function loadManifest(){ INV = (curStage? curStage.cargo : MANIFESTS[curCon]).map(type=>({type, placed:false})); }

// ═══ 📅 스테이지 (작은 포워더 선적 스케줄) ═══
const STAGES = [
  { when:'9월 3주차 (수) 출항', client:'한빛무역', con:'20gp', fee:150, goal:{maxDmg:0},
    brief:'첫 의뢰입니다! 20ft 컨테이너 FCL — 이 화물을 <b>전부</b> 싣고 <b>무손상</b>으로 보내주세요. (벽·다른 화물에 붙여 쌓아야 흔들림이 없어요)',
    cargo:['carton','carton','carton','carton','pallet','pallet','crate','drum','drum','bigbag','glass'] },
  { when:'9월 3주차 (토) 출항', client:'대양상사', con:'40gp', fee:300, goal:{maxDmg:1},
    brief:'40ft FCL 큰 건입니다. 화물을 전부 싣고 손상 1개 이내로.',
    cargo:['machine','ibc','pallet','pallet','crate','pipe','bigbag','bigbag','glass','glass','drum','drum','drum','carton','carton','carton','carton'] },
  { when:'9월 4주차 (화) 출항', client:'신선물류', con:'20rf', fee:280, goal:{maxDmg:0},
    brief:'❄️ 냉동 컨테이너 특수 건! 청과·냉동식품을 전부 싣고 <b>무손상</b>으로. 냉동은 실수가 안 됩니다.',
    cargo:['produce','produce','frozen','frozen','frozen','frozen','carton','carton','frozen'] },
  { when:'9월 4주차 (금) 출항', client:'글로벌테크', con:'40hc', fee:420, goal:{maxDmg:1},
    brief:'40ft 하이큐브 대량 선적. 천장이 높으니 위로도 쌓으세요 — 전량 적재, 손상 1개 이내.',
    cargo:['machine','ibc','ibc','pallet','pallet','crate','crate','pipe','pipe','bigbag','bigbag','glass','glass','glass','drum','drum','carton','carton','carton','carton'] },
  { when:'10월 1주차 (수) 출항', client:'정밀산업', con:'20gp', fee:400, goal:{maxDmg:0},
    brief:'까다로운 건입니다 — 깨지기 쉬운 판유리와 중량물이 많아요. 배치 실력이 시험대. 전량·무손상!',
    cargo:['glass','glass','glass','machine','ibc','pipe','drum','drum','carton','carton','bigbag'] },
  { when:'10월 1주차 (토) 출항', client:'한바다해운', con:'40hc', fee:650, goal:{maxDmg:1},
    brief:'🏆 최종 의뢰! 대형 혼합 화물을 하이큐브에 전부. 포워더의 진짜 실력을 보여줄 때입니다.',
    cargo:['machine','machine','ibc','ibc','pallet','pallet','pallet','crate','crate','pipe','pipe','bigbag','bigbag','glass','glass','glass','drum','drum','drum','carton','carton','carton','carton','carton'] },
];
let progress; try{ progress=JSON.parse(localStorage.getItem('cargo_progress')||'{"cleared":0,"cash":0}'); }catch(e){ progress={cleared:0,cash:0}; }
let curStage=null, curStageIdx=-1;

// ═══ 화물 3D 형상 빌더 (원점 중심, w×h×d 셀) ═══
function mkMesh(geo,color,rough=0.6,metal=0.1,opts={}){ const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...opts}); return new THREE.Mesh(geo,m); }
function buildCargo(type,w,h,d){
  const t=TYPES[type], W=w*CELLX*0.94, H=h*CELLY*0.94, D=d*CELLZ*0.94, g=new THREE.Group();
  if(type==='pallet'||type==='produce'){
    const pal=mkMesh(new THREE.BoxGeometry(W,H*0.1,D),0x8a6a44,0.85); pal.position.y=-H*0.45; g.add(pal);
    for(const sx of [-W*0.35,0,W*0.35]){ const foot=mkMesh(new THREE.BoxGeometry(0.06,H*0.08,D*0.9),0x6a5236,0.85); foot.position.set(sx,-H*0.5,0); g.add(foot); }
    const load=mkMesh(new THREE.BoxGeometry(W*0.94,H*0.78,D*0.94), t.color,0.7,0.05); load.position.y=H*0.04; g.add(load);
    for(const yy of [-0.15,0.2]){ const wrap=mkMesh(new THREE.BoxGeometry(W*0.96,H*0.04,D*0.96),0xffffff,0.2,0.1,{transparent:true,opacity:0.25}); wrap.position.y=H*yy; g.add(wrap); }
  } else if(type==='ibc'){
    const tank=mkMesh(new THREE.BoxGeometry(W*0.88,H*0.82,D*0.88), t.color,0.3,0.1,{transparent:true,opacity:0.85}); tank.position.y=H*0.02; g.add(tank);
    const cageM=0x55585f;
    for(const yy of [-0.42,-0.15,0.15,0.42]){ const bar=mkMesh(new THREE.BoxGeometry(W*0.96,0.035,D*0.96),cageM,0.5,0.6); bar.position.y=H*yy; g.add(bar); } // 가로 케이지 (프레임만)
    for(const sx of [-1,1])for(const sz of [-1,1]){ const post=mkMesh(new THREE.BoxGeometry(0.04,H*0.98,0.04),cageM,0.5,0.6); post.position.set(sx*W*0.44,0,sz*D*0.44); g.add(post); }
    const cap=mkMesh(new THREE.CylinderGeometry(W*0.12,W*0.12,H*0.08,10),0x333,0.4,0.5); cap.position.y=H*0.46; g.add(cap);
    const pal=mkMesh(new THREE.BoxGeometry(W,0.06,D),0x8a6a44,0.9); pal.position.y=-H*0.48; g.add(pal);
  } else if(type==='bigbag'){
    const bag=mkMesh(new THREE.CylinderGeometry(Math.min(W,D)*0.5,Math.min(W,D)*0.44,H*0.9,10), t.color,0.85,0); bag.position.y=-H*0.02; g.add(bag);
    const top=mkMesh(new THREE.CylinderGeometry(Math.min(W,D)*0.14,Math.min(W,D)*0.2,H*0.12,8),0xb8a870,0.8); top.position.y=H*0.48; g.add(top);
    for(const a of [0,Math.PI/2]){ const loop=mkMesh(new THREE.TorusGeometry(Math.min(W,D)*0.22,0.02,5,10),0xa89860,0.7); loop.position.y=H*0.44; loop.rotation.y=a; g.add(loop); }
  } else if(type==='drum'){
    const r=Math.min(W,D)*0.46;
    g.add(mkMesh(new THREE.CylinderGeometry(r,r,H*0.96,20), t.color,0.45,0.4));
    for(const yy of [H*0.32,-H*0.32]){ const ring=mkMesh(new THREE.CylinderGeometry(r*1.04,r*1.04,H*0.05,20),0x2a557a,0.5,0.5); ring.position.y=yy; g.add(ring); }
    const lid=mkMesh(new THREE.CylinderGeometry(r*0.42,r*0.42,H*0.05,12),0xd0d4dc,0.4,0.6); lid.position.y=H*0.48; g.add(lid);
  } else if(type==='pipe'){
    const pr=Math.min(H,D)*0.24;
    for(const [oy,oz] of [[0.42,0.4],[0.42,-0.4],[-0.42,0.4],[-0.42,-0.4],[0,0]]){
      const p=mkMesh(new THREE.CylinderGeometry(pr,pr,W*0.98,14), t.color,0.4,0.65); p.rotation.z=Math.PI/2; p.position.set(0,oy*H*0.5,oz*D*0.85); g.add(p); }
    for(const xx of [-W*0.34,W*0.34]){ const band=mkMesh(new THREE.TorusGeometry(Math.max(H,D)*0.42,0.025,6,18),0x2a2a30,0.5,0.3); band.rotation.y=Math.PI/2; band.position.x=xx; g.add(band); }
  } else if(type==='crate'){
    g.add(mkMesh(new THREE.BoxGeometry(W,H,D), t.color,0.85,0));
    const fr=0.055, fm=0x6a5230;
    for(const sx of [-1,1])for(const sz of [-1,1]){ const post=mkMesh(new THREE.BoxGeometry(fr,H*1.01,fr),fm,0.85); post.position.set(sx*W/2,0,sz*D/2); g.add(post); }
    for(const yy of [-H*0.42,H*0.42]){
      for(const sz of [-1,1]){ const b=mkMesh(new THREE.BoxGeometry(W*1.01,fr,fr),fm,0.85); b.position.set(0,yy,sz*D/2); g.add(b); }
      for(const sx of [-1,1]){ const b=mkMesh(new THREE.BoxGeometry(fr,fr,D*1.01),fm,0.85); b.position.set(sx*W/2,yy,0); g.add(b); }
    }
  } else if(type==='glass'){
    const pane=mkMesh(new THREE.BoxGeometry(W*0.9,H*0.82,D*0.16), t.color,0.15,0.1,{transparent:true,opacity:0.5}); pane.position.y=H*0.06; g.add(pane);
    g.add((()=>{ const b=mkMesh(new THREE.BoxGeometry(W,H*0.12,D),0x8a6a4a,0.85); b.position.y=-H*0.44; return b; })());
    for(const sx of [-W*0.42,W*0.42]){ const post=mkMesh(new THREE.BoxGeometry(0.05,H*0.85,0.05),0x8a6a4a,0.85); post.position.x=sx; g.add(post); }
  } else if(type==='machine'){

const key = (i,j,k)=>`${i},${j},${k}`;
function footprint(type, rot){ const t=TYPES[type]; return rot? {w:t.d,d:t.w,h:t.h} : {w:t.w,d:t.d,h:t.h}; }

function canPlace(type,rot,i,j){
  const f=footprint(type,rot);
  if(i<0||j<0||i+f.w>CW||j+f.d>CD) return null;
  // 가장 낮은 지지 높이 찾기
  for(let k=0;k<=CH-f.h;k++){
    let ok=true, supported=(k===0);
    for(let di=0;di<f.w;di++)for(let dj=0;dj<f.d;dj++){
      for(let dk=0;dk<f.h;dk++) if(occ[key(i+di,j+dj,k+dk)]!==undefined) ok=false;
      if(k>0 && occ[key(i+di,j+dj,k-1)]!==undefined) supported=true;
    }
    if(ok && supported) return {i,j,k,...f};
  }
  return null;
}
function place(type,rot,i,j){
  const spot=canPlace(type,rot,i,j); if(!spot) return null;
  const t=TYPES[type], id=nextId++;
  const mesh=buildCargo(type, spot.w, spot.h, spot.d);
  mesh.position.set(
    OX + (spot.i+spot.w/2)*CELLX,
    0.06 + (spot.k+spot.h/2)*CELLY,
    OZ + (spot.j+spot.d/2)*CELLZ);
  con.add(mesh);
  // 라벨(fragile/heavy 아이콘 스프라이트)
  if(t.fragile||t.heavy){ const s=makeLabel(t.icon); s.position.copy(mesh.position); s.position.y+=spot.h*0.5+0.15; con.add(s); mesh.userData.label=s; }
  for(let di=0;di<spot.w;di++)for(let dj=0;dj<spot.d;dj++)for(let dk=0;dk<spot.h;dk++) occ[key(spot.i+di,spot.j+dj,spot.k+dk)]=id;
  const item={id,type,rot,...spot,mesh,damaged:false,invIdx:null};
  mesh.userData.owner=item;
  placed.push(item);
  return item;
}
// 셀 점유 갱신 (이동용)
function setOcc(p, val){ for(let di=0;di<p.w;di++)for(let dj=0;dj<p.d;dj++)for(let dk=0;dk<p.h;dk++){ if(val===null) delete occ[key(p.i+di,p.j+dj,p.k+dk)]; else occ[key(p.i+di,p.j+dj,p.k+dk)]=val; } }
function meshPos(p){ return new THREE.Vector3(OX+(p.i+p.w/2)*CELLX, 0.06+(p.k+p.h/2)*CELLY, OZ+(p.j+p.d/2)*CELLZ); }
function moveItem(p,i,j,k){ p.i=i;p.j=j;p.k=k; const pos=meshPos(p); p.mesh.position.copy(pos); if(p.mesh.userData.label){ p.mesh.userData.label.position.copy(pos); p.mesh.userData.label.position.y+=p.h*0.5+0.15; } setOcc(p,p.id); }
function highlight(p,on){ paintCargo(p.mesh, null, on?0x224466:(p.lashed?0x1a3a1a:0x000000)); }
// 화물이 몇 면 고정됐나 (벽 또는 이웃 화물) — 2면 이상이면 안 흔들림
function sideBlocked(p){
  let s=0;
  for(const [di,dj] of [[-1,0],[1,0],[0,-1],[0,1]]){
    if(di<0&&p.i===0){s++;continue;} if(di>0&&p.i+p.w>=CW){s++;continue;}
    if(dj<0&&p.j===0){s++;continue;} if(dj>0&&p.j+p.d>=CD){s++;continue;}
    let blocked=false;
    for(let k=0;k<p.h && !blocked;k++){
      if(di!==0){ const ci=di<0?p.i-1:p.i+p.w; for(let a=0;a<p.d;a++) if(occ[key(ci,p.j+a,p.k+k)]!==undefined){blocked=true;break;} }
      else { const cj=dj<0?p.j-1:p.j+p.d; for(let a=0;a<p.w;a++) if(occ[key(p.i+a,cj,p.k+k)]!==undefined){blocked=true;break;} }
    }
    if(blocked)s++;
  }
  return s;
}

  const cx=cv.getContext('2d'); cx.font='44px sans-serif'; cx.textAlign='center'; cx.fillText(txt,32,46);
  const tx=new THREE.CanvasTexture(cv); const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false}));
  sp.scale.set(0.5,0.5,0.5); return sp;
}

let rolling=0;
function sailAndJudge(){
  rolling=3.2;   // 3.2초 롤링
  setTimeout(()=>{
    // ── 손상 판정 ──
    const cbmUsed = placed.reduce((a,p)=>a+p.w*p.d*p.h,0);
    for(const p of placed){
      const t=TYPES[p.type]; let hit=false;
      // 1) 유리 위에 무엇이든 실림 → 눌림
      if(t.fragile){ for(let di=0;di<p.w;di++)for(let dj=0;dj<p.d;dj++) if(occ[key(p.i+di,p.j+dj,p.k+p.h)]!==undefined) hit=true; }
      // 2) 중량이 바닥이 아닌 곳(k>0)에 → 아래 화물 짓눌림
      if(t.heavy && p.k>0){ hit=true; const bId=occ[key(p.i,p.j,p.k-1)]; const below=bId!==undefined?itemById(bId):null; if(below) below.damaged=true; }
      // 3) 고정 안 됨 → 흔들림: 위 열림+사방 지지 부족한 화물만 (벽·이웃 붙이거나 🔒라싱하면 안전)
      if(!hit && !t.heavy && !p.lashed){
        let topOpen = p.k+p.h<CH;
        if(topOpen){ for(let di=0;di<p.w;di++)for(let dj=0;dj<p.d;dj++) if(occ[key(p.i+di,p.j+dj,p.k+p.h)]!==undefined){ topOpen=false; break; } }
        if(topOpen && sideBlocked(p)<2 && Math.random()<0.55) hit=true;
      }
      if(hit) p.damaged=true;
    }
    placed.filter(p=>p.damaged).forEach(p=>{ paintCargo(p.mesh, 0xd03030, 0x551010); });
    doorTarget=1;   // 문 열어서 결과 공개
    setTimeout(()=>showResult(cbmUsed), 1000);
  }, 3400);
}
function showResult(cbmUsed){
  const dmgList=placed.filter(p=>p.damaged);
  const dmgCbm=dmgList.reduce((a,p)=>a+p.w*p.d*p.h,0);
  const loaded=placed.length, total=INV.length;
  const rate=cbmUsed/(CW*CD*CH);
  const mB=document.getElementById('modalBody');
  if(curStage){   // 📅 스테이지 판정 — 전량 적재 + 손상 제한, 그리고 손익 정산
    const g=curStage.goal;
    const allLoaded = placed.length===INV.length;
    const pass = allLoaded && dmgList.length<=g.maxDmg;
    // 💰 부대비용
    const thc=CONTAINERS[curCon].thc, doc=10;
    const dgN=placed.filter(p=>TYPES[p.type].hazmat).length, dg=dgN*8;
    const woodN=placed.filter(p=>p.type==='crate'||p.type==='pallet').length, fum=woodN>0?15:0;
    const reefer=CONTAINERS[curCon].reefer?40:0;
    const lashN=placed.filter(p=>p.lashed).length, lash=lashN*12;
    const dead=Math.round((1-rate)*curStage.fee*0.22);
    const cost=thc+doc+dg+fum+reefer+lash+dead;
    const net=curStage.fee-cost;
    let earned=0;
    if(pass && curStageIdx===progress.cleared){ progress.cleared++; progress.cash+=net; earned=net;
      try{ localStorage.setItem('cargo_progress',JSON.stringify(progress)); }catch(e){} }
    const last = curStageIdx+1>=STAGES.length;
    const costLine = `THC ${thc} · 서류 ${doc}`+(dg?` · ☣️위험물 ${dg}`:'')+(fum?` · 🪵훈증 ${fum}`:'')+(reefer?` · ❄️전기 ${reefer}`:'')+(lash?` · 🔒라싱 ${lash}`:'')+(dead?` · 📉데드 ${dead}`:'');
    mB.innerHTML=
      `<h2>${pass?'✅ 선적 완료!':'❌ 목표 미달'}</h2>`+
      `적재 <b>${placed.length}/${INV.length}개</b> · 손상 <b>${dmgList.length}개</b> (허용 ${g.maxDmg})<br><br>`+
      (pass
        ? `<div style="font-size:13px;color:#666;text-align:left;line-height:1.7">💵 운임 +${curStage.fee}<br>➖ ${costLine}</div>`+
          `<div style="font-size:22px;margin-top:6px">순이익 <b style="color:${net>=0?'#c05a46':'#b04040'}">${net>=0?'+':''}${net}만원</b></div>`+
          `누적 수익 <b>${progress.cash}만원</b><br><br>`+
          (last?`<div style="font-size:17px;color:#c05a46">🏆 모든 선적 완수 — 포워더 성공!</div><br>`:`<button onclick="startStage(${curStageIdx+1})">▶ 다음 스테이지</button>`)
        : `<div style="color:#b04040;font-size:13.5px">${!allLoaded?`화물을 다 싣지 못했어요 (${placed.length}/${INV.length}) — 회전·재배치로 빈틈을 메우세요`:`손상이 많아요 (${dmgList.length} > ${g.maxDmg}) — 유리는 맨 위, 중량은 바닥, 벽·이웃에 붙이거나 🔒라싱`}</div><br>`+
          `<button onclick="retryStage()">🔄 다시 작업</button>`)+
      `<button onclick="backToStages()" style="background:#5a6270">🗂 스케줄로</button>`;
    document.getElementById('modal').style.display='flex';
    return;
  }
  // (자유 모드 폴백)
  const base=cbmUsed*100, bonus=(nextUnplaced()<0)?500:0, penalty=dmgCbm*220;
  const score=Math.max(0, base+bonus-penalty-handCost);
  mB.innerHTML=`<h2>📋 하역 결과</h2>적재율 ${Math.round(rate*100)}% · 손상 ${dmgList.length}개 · 최종 <b>${score}</b>점<br><button onclick="backToStages()">🗂 스케줄로</button>`;
  document.getElementById('modal').style.display='flex';
}

// ═══ 입력 (탭 배치 / 드래그 시점) ═══
let camYaw=0.9, camPitch=0.72, camDist=11;
function updateCam(){ camPitch=Math.max(0.2,Math.min(1.4,camPitch)); camDist=Math.max(5,Math.min(40,camDist));
  camera.position.set(Math.sin(camYaw)*Math.cos(camPitch)*camDist, Math.sin(camPitch)*camDist+0.5, Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(0,CON.H/2,0); }
window.resetView=()=>{ camYaw=0.9; camPitch=0.72; camDist=Math.max(11, CON.L*1.85); updateCam(); };
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let mode=null,lastX=0,lastY=0,dX=0,dY=0,moved=false;
let grabP=null;            // down이 얹힌 배치 화물
let selectedP=null;        // 선택된 화물 (회전/삭제 대상)
function setNdc(x,y){ const r=canvas.getBoundingClientRect(); ndc.x=((x-r.left)/r.width)*2-1; ndc.y=-((y-r.top)/r.height)*2+1; ray.setFromCamera(ndc,camera); }
function pickCargo(x,y){ setNdc(x,y); const h=ray.intersectObjects(placed.map(p=>p.mesh),true)[0]; return h?ownerOf(h.object):null; }
function floorCell(x,y){ setNdc(x,y); const h=ray.intersectObjects([floorPlate,...placed.map(p=>p.mesh)],true)[0]; if(!h)return null;
  return { i:Math.floor((h.point.x-OX)/CELLX), j:Math.floor((h.point.z-OZ)/CELLZ), pt:h.point }; }
function selectP(p){ if(selectedP) highlight(selectedP,false); selectedP=p; if(p){ highlight(p,true); flash(`선택: ${TYPES[p.type].icon} ${TYPES[p.type].name} — 드래그로 이동, ↻ 회전, ✕ 제거`); } }

function onDown(x,y){ dX=x;dY=y;lastX=x;lastY=y;moved=false;
  if(departed){ mode='orbit'; return; }
  grabP=pickCargo(x,y); mode='down'; }
function onMove(x,y){
  if(!mode)return;
  if(!moved && Math.abs(x-dX)+Math.abs(y-dY)>5) moved=true;
  if(mode==='down' && moved){ mode = grabP ? 'drag' : 'orbit'; if(mode==='drag'){ selectP(grabP); setOcc(grabP,null); } }
  if(mode==='orbit'){ camYaw-=(x-lastX)*0.006; camPitch+=(y-lastY)*0.006; updateCam(); }
  else if(mode==='drag' && grabP){ const fc=floorCell(x,y); if(fc){ grabP.mesh.position.set(OX+(fc.i+grabP.w/2)*CELLX, CON.H+0.4, OZ+(fc.j+grabP.d/2)*CELLZ); } }
  lastX=x;lastY=y;
}
function onUp(x,y){
  if(mode==='down' && !moved){        // 탭
    if(grabP) selectP(selectedP===grabP?null:grabP);   // 화물 탭 = 선택/해제
    else tapPlace(x,y);                                // 빈 곳 탭 = 큐 배치
  } else if(mode==='drag' && grabP){  // 드래그 놓기 = 재배치
    dropGrab(x,y);
  }
  mode=null; grabP=null;
}
function dropGrab(x,y){
  const fc=floorCell(x,y);
  const orig={i:grabP.i,j:grabP.j,k:grabP.k};
  let ok=false;
  if(fc){ const spot=canPlace(grabP.type,grabP.rot,fc.i,fc.j); if(spot){ moveItem(grabP,spot.i,spot.j,spot.k); handCost+=8; ok=true; updateHUD(); } }   // 재배치도 비용
  if(!ok){ moveItem(grabP,orig.i,orig.j,orig.k); flash('그 자리엔 안 들어가요 — 제자리로'); }
}
function tapPlace(x,y){
  if(departed) return;
  if(curSel<0||INV[curSel].placed){ curSel=nextUnplaced(); }
  if(curSel<0){ flash('화물을 다 실었어요 — ⚓ 출항!'); return; }
  const fc=floorCell(x,y); if(!fc) return;
  const inv=INV[curSel];
  const p=place(inv.type,rot,fc.i,fc.j);
  if(p){ inv.placed=true; p.invIdx=curSel; handCost+=handlingCost(p.w,p.h,p.k); curSel=nextUnplaced(curSel); updateHUD(); }
  else flash('여기엔 안 들어가요 (공간 부족/지지 없음)');
}
window.pickInv=(idx)=>{ if(departed||INV[idx].placed||replayTimer) return; curSel=idx; updateHUD(); flash(`선택: ${TYPES[INV[idx].type].icon} ${TYPES[INV[idx].type].name} — 바닥에 탭!`); };

// ═══ 🤖 AI 최적 적재 솔버 (휴리스틱: 무거운·큰 것 먼저 바닥, 유리 마지막 위로, 빈틈 최소) ═══
function vLowestK(vocc,f,i,j){ for(let k=0;k<=CH-f.h;k++){ let ok=true,sup=(k===0);
  for(let di=0;di<f.w;di++)for(let dj=0;dj<f.d;dj++){ for(let dk=0;dk<f.h;dk++) if(vocc[key(i+di,j+dj,k+dk)]!==undefined) ok=false; if(k>0&&vocc[key(i+di,j+dj,k-1)]!==undefined) sup=true; }
  if(ok&&sup) return k; } return -1; }
function solveOptimal(){
  const items=INV.map((x,idx)=>({type:x.type,idx,...TYPES[x.type]}));
  items.sort((a,b)=>{ if(!!a.fragile!==!!b.fragile) return a.fragile?1:-1;      // 유리는 맨 나중
    if(!!a.heavy!==!!b.heavy) return a.heavy?-1:1;                             // 중량은 먼저(바닥)
    return (b.w*b.d*b.h)-(a.w*a.d*a.h); });                                    // 큰 것 먼저
  const vocc={}, plan=[];
  for(const it of items){ let best=null;
    for(const rr of [0,1]){ const f=footprint(it.type,rr);
      for(let i=0;i<=CW-f.w;i++)for(let j=0;j<=CD-f.d;j++){ const k=vLowestK(vocc,f,i,j); if(k<0)continue;
        let sc = it.fragile? k*20 : -k*20;   // 유리는 높이, 나머지는 낮게
        sc -= (i*2+j);                        // 안쪽·왼쪽부터 채우기
        if(!best||sc>best.sc) best={sc,i,j,k,rot:rr,f}; } }
    if(best){ for(let di=0;di<best.f.w;di++)for(let dj=0;dj<best.f.d;dj++)for(let dk=0;dk<best.f.h;dk++) vocc[key(best.i+di,best.j+dj,best.k+dk)]=it.idx;
      plan.push({type:it.type,rot:best.rot,i:best.i,j:best.j}); } }
  return plan;
}
let replayTimer=null;
window.aiDemo=()=>{
  if(replayTimer||departed) return;
  clearAll();
  const plan=solveOptimal();
  flash('🤖 AI가 최적 순서로 적재하는 중…'); let idx=0;
  replayTimer=setInterval(()=>{
    if(idx>=plan.length){ clearInterval(replayTimer); replayTimer=null; setTimeout(()=>depart(), 800); return; }
    const s=plan[idx++]; const p=place(s.type,s.rot,s.i,s.j);
    if(p){ markInvPlaced(s.type); handCost+=handlingCost(p.w,p.h,p.k); p.fall=2.6; updateHUD(); }
  }, 400);
};
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId);}catch(_){}onDown(e.clientX,e.clientY);});
canvas.addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
canvas.addEventListener('pointerup',e=>onUp(e.clientX,e.clientY));
canvas.addEventListener('wheel',e=>{camDist+=e.deltaY*0.01;updateCam();},{passive:true});
let pinch=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=pd(e);},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=pd(e);camDist*=pinch/d;pinch=d;updateCam();}},{passive:true});
function pd(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}

// ═══ HUD ═══
function updateHUD(){
  const cbm=placed.reduce((a,p)=>a+p.w*p.d*p.h,0);
  const remain=INV.filter(x=>!x.placed).length;
  const stageTag = curStage? `📋 St${curStageIdx+1} · 🎯전량${curStage.goal.maxDmg===0?'·무손상':''}` : '';
  const lashN=placed.filter(p=>p.lashed).length;
  document.getElementById('score').innerHTML=`${CONTAINERS[curCon].icon} <b>${CONTAINERS[curCon].name}</b> ${stageTag} · 적재 <b>${placed.length}/${INV.length}</b> · <b>${cbmOf(cbm)} CBM</b> (${Math.round(cbm/(CW*CD*CH)*100)}%)${lashN?` · 🔒${lashN}`:''}<br>남은 화물: ${remain}개 · 다 실으면 ⚓ 출항`;
  // 화물 목록 — 클릭해서 선택, 배치된 건 흐리게
  document.getElementById('next').innerHTML=INV.map((item,idx)=>{
    const T=TYPES[item.type]; const cls=item.placed?'done':idx===curSel?'cur':'';
    return `<div class="card ${cls}" onclick="pickInv(${idx})">${T.icon}<br>${T.name}</div>`;
  }).join('');
  const cur = curSel>=0 && !INV[curSel]?.placed ? INV[curSel] : null;
  document.getElementById('bottom').innerHTML = remain>0
    ? (cur? `<button class="hot" onclick="pickInv(${curSel})">실을 화물: ${TYPES[cur.type].icon} ${TYPES[cur.type].name} <span style="opacity:.7">(${footprint(cur.type,rot).w}×${footprint(cur.type,rot).d}×${TYPES[cur.type].h})</span> — 바닥 탭!</button>`
             : `<button class="hot">↑ 화물 목록에서 실을 것을 고르세요</button>`)
    : `<button class="go" onclick="depart()">⚓ 다 실었다! 출항</button>`;
}
let ht; function flash(m){ const h=document.getElementById('hint'); h.textContent=m; clearTimeout(ht); ht=setTimeout(()=>h.textContent='바닥 탭=놓기 · 화물 탭=선택 · 화물 드래그=이동 · ↻회전 · ↩제거',2400); }

// ═══ 🔍 화물 인스펙터 (별도 3D 뷰 — 클릭한 화물 확인 + 돌려보기) ═══
const insCanvas=document.getElementById('ic');
const insR=new THREE.WebGLRenderer({canvas:insCanvas,antialias:true,alpha:true});
insR.setPixelRatio(Math.min(devicePixelRatio,2));
const insS=new THREE.Scene();
insS.add(new THREE.HemisphereLight(0xffffff,0x445,1.15));
const il=new THREE.DirectionalLight(0xffffff,0.95); il.position.set(3,5,4); insS.add(il);
const insC=new THREE.PerspectiveCamera(38,1,0.1,50);
let insMesh=null, insYaw=0.6, insPitch=0.35, insActive=false, insAuto=true, idrag=false, ilx=0, ily=0;
function sizeIns(){ const s=Math.min(300, Math.floor(innerWidth*0.72)); insCanvas.style.width=s+'px'; insCanvas.style.height=s+'px'; insR.setSize(s,s,false); insC.aspect=1; insC.updateProjectionMatrix(); }
window.openInspector=(type)=>{
  const t=TYPES[type];
  if(insMesh) insS.remove(insMesh);
  insMesh=buildCargo(type,t.w,t.h,t.d); insS.add(insMesh);
  const maxd=Math.max(t.w,t.h,t.d); insC.position.set(0, t.h*0.15, maxd*2.5); insC.lookAt(0,0,0);
  const sc = t.fragile?'#ecc94b':t.hazmat?'#e08a5a':t.heavy?'#e0705a':'#9de89a';
  document.getElementById('iinfo').innerHTML=
    `<b>${t.icon} ${t.name}</b><br>`+
    `규격 ${(t.w*CELLX).toFixed(1)}×${(t.d*CELLZ).toFixed(1)}×${(t.h*CELLY).toFixed(1)} m · <b>${cbmOf(t.w*t.d*t.h)} CBM</b> · ${t.wt}t<br>`+
    `상태 <b style="color:${sc}">${t.status}</b>`+
    `${t.upright?' · ⬆️ 세워서':''}${t.hazmat?' · ☣️ 위험물':''}<br>`+
    `<span style="color:#99a;font-size:12px">${t.desc}</span>`;
  document.getElementById('inspector').style.display='flex';
  insActive=true; insAuto=true; insYaw=0.6; insPitch=0.35; sizeIns();
};
window.closeInspector=()=>{ document.getElementById('inspector').style.display='none'; insActive=false; };
window.inspectSel=()=>{
  let type=null;
  if(selectedP) type=selectedP.type;
  else if(curSel>=0 && INV[curSel] && !INV[curSel].placed) type=INV[curSel].type;
  if(type) openInspector(type); else flash('화물을 먼저 선택하세요 (목록 카드나 실린 화물 탭)');
};
// 🔒 라싱 — 선택한 화물을 고정 (흔들림 면제, 대신 라싱비). 벽·이웃에 잘 붙이면 라싱 불필요
window.lashSel=()=>{
  if(departed) return;
  if(!selectedP){ flash('고정할 화물을 먼저 탭하세요'); return; }
  selectedP.lashed=!selectedP.lashed;
  paintCargo(selectedP.mesh, null, selectedP.lashed?0x1a3a1a:0x224466);
  flash(selectedP.lashed?'🔒 라싱 고정 — 흔들림 방지 (라싱비 12만/개)':'라싱 해제');
  updateHUD();
};
insCanvas.addEventListener('pointerdown',e=>{ idrag=true; insAuto=false; ilx=e.clientX; ily=e.clientY; e.stopPropagation(); });
addEventListener('pointermove',e=>{ if(!idrag)return; insYaw+=(e.clientX-ilx)*0.012; insPitch+=(e.clientY-ily)*0.012; insPitch=Math.max(-1.3,Math.min(1.3,insPitch)); ilx=e.clientX; ily=e.clientY; });
addEventListener('pointerup',()=>{ idrag=false; });

function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(insActive) sizeIns(); }
addEventListener('resize',resize);
loadManifest(); resize(); resetView(); updateHUD();
renderStageSelect();   // 🚢 시작은 스테이지 선택 화면부터
let t=0;
renderer.setAnimationLoop(()=>{
  // 문
  if(Math.abs(doorOpen-doorTarget)>0.001){ doorOpen+=(doorTarget-doorOpen)*0.12; for(const d of doors) d.p.rotation.y=-d.sign*doorOpen*Math.PI*0.82; }
  // 항해 롤링
  if(rolling>0){ rolling-=1/60; t+=0.08; con.rotation.z=Math.sin(t)*0.09; con.rotation.x=Math.sin(t*0.7)*0.05; if(rolling<=0){con.rotation.z=0;con.rotation.x=0;} }
  // 🤖 리플레이 낙하 연출
  for(const p of placed){ if(p.fall>0){ p.mesh.position.y=(0.06+(p.k+p.h/2)*CELLY)+p.fall; p.fall*=0.8; if(p.fall<0.02){ p.fall=0; p.mesh.position.y=0.06+(p.k+p.h/2)*CELLY; } } }
  renderer.render(scene,camera);
  // 🔍 인스펙터 렌더 (열렸을 때만)
  if(insActive && insMesh){ if(insAuto) insYaw+=0.008; insMesh.rotation.y=insYaw; insMesh.rotation.x=insPitch; insR.render(insS,insC); }
});
</script>
