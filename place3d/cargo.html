<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🚢 컨테이너 적재 게임 — 방과후 스튜디오</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0e1015;
    font-family:'Malgun Gothic',sans-serif; color:#dde; touch-action:none; }
  #c { display:block; width:100%; height:100%; }
  #top { position:fixed; top:0; left:0; right:0; padding:8px 12px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(rgba(14,16,21,.92), transparent); z-index:5; pointer-events:none; }
  #top > * { pointer-events:auto; }
  h1 { font-size:14px; margin:0; color:#ffd08a; }
  button { background:#242a36; color:#dde; border:1px solid #3a4356; border-radius:9px;
    padding:8px 11px; font-size:13px; font-family:inherit; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.hot { background:#5aa0e8; color:#fff; border:0; }
  button.go { background:#e8734f; color:#fff; border:0; font-weight:bold; }
  #score { position:fixed; top:40px; left:10px; font-size:12px; line-height:1.55;
    background:rgba(0,0,0,.5); border-radius:10px; padding:7px 11px; z-index:5; }
  #score b { color:#ecc94b; }
  #next { position:fixed; bottom:56px; left:0; right:0; display:flex; gap:6px;
    flex-wrap:nowrap; overflow-x:auto; padding:0 10px; z-index:5; -webkit-overflow-scrolling:touch; }
  #next::-webkit-scrollbar { height:0; }
  #next .card { background:#1b1e27; border:2px solid #3a4356; border-radius:9px; padding:5px 8px;
    font-size:12px; min-width:52px; text-align:center; flex:0 0 auto; cursor:pointer; }
  #next .card.cur { border-color:#ffd08a; background:#2a2418; }
  #next .card.done { opacity:.32; cursor:default; }
  #bottom { position:fixed; bottom:0; left:0; right:0; padding:9px; display:flex; gap:8px;
    justify-content:center; background:linear-gradient(transparent, rgba(14,16,21,.92)); z-index:5; }
  #hint { position:fixed; bottom:98px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); border-radius:10px; padding:5px 13px; font-size:12px;
    color:#cdd8ee; z-index:5; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.82); display:none;
    align-items:center; justify-content:center; z-index:20; }
  #modal .box { background:#f7f1e3; color:#333; border-radius:14px; padding:22px 26px;
    width:86%; max-width:380px; font-size:15px; line-height:1.8; text-align:center; }
  #modal h2 { color:#c05a46; margin-top:0; } #modal b { color:#c05a46; }
  #modal button { width:100%; background:#e8734f; color:#fff; border:0; margin-top:12px; padding:12px; }
  #inspector { position:fixed; inset:0; background:rgba(10,12,18,.88); display:none;
    align-items:center; justify-content:center; z-index:25; flex-direction:column; }
  #inspector .ibox { background:#1b1e27; border-radius:16px; padding:16px 18px; text-align:center; }
  #ic { border-radius:12px; background:radial-gradient(circle at 50% 40%, #2a3040, #14161c); touch-action:none; cursor:grab; }
  #iinfo { color:#dde; font-size:14px; line-height:1.7; margin:12px 4px 4px; }
  #iinfo b { color:#ffd08a; font-size:16px; }
  #inspector .close { background:#3a4356; color:#fff; border:0; border-radius:9px; padding:10px 30px; margin-top:12px; font-size:14px; }
  #inspector .tip { color:#889; font-size:11.5px; margin-top:8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <h1>🚢 컨테이너 적재 게임</h1>
  <span style="flex:1"></span>
  <button onclick="rotateCargo()">↻ 회전</button>
  <button onclick="undo()">↩ 취소</button>
  <button onclick="inspectSel()">🔍 보기</button>
  <button onclick="aiDemo()">🤖 AI</button>
  <button onclick="resetView()">🎥</button>
  <button class="go" onclick="depart()">⚓ 출항</button>
</div>
<div id="score"></div>
<div id="next"></div>
<div id="hint">바닥 탭=놓기 · 화물 탭=선택 · 화물 드래그=이동 · ↻회전 · ↩제거</div>
<div id="bottom"></div>
<div id="modal"><div class="box" id="modalBody"></div></div>
<div id="inspector"><div class="ibox">
  <canvas id="ic"></canvas>
  <div id="iinfo"></div>
  <div class="tip">🔄 드래그해서 돌려보기 · 손 떼면 자동 회전</div>
  <button class="close" onclick="closeInspector()">닫기</button>
</div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ═══ 규격 (셀 = 1m, ISO 20ft 근사) ═══
const CON = { L: 5.90, W: 2.35, H: 2.39 };
const CW = 5, CD = 2, CH = 2;   // 셀 격자 5×2×2 = 20셀
const CELL = 1.0;
const OX = -CW/2, OZ = -CD/2;   // 셀→월드 오프셋 (컨테이너 중앙정렬, 셀은 1m라 격자와 컨테이너 살짝 다름 무시)

// ═══ 화물 종류 (실물 형상) ═══
const TYPES = {
  carton:  { w:1,d:1,h:1, wt:1, color:0xc8a878, name:'박스',   icon:'📦' },
  drum:    { w:1,d:1,h:1, wt:2, color:0x3a7ac0, name:'드럼통', icon:'🛢' },
  crate:   { w:2,d:1,h:1, wt:2, color:0x9a7a4a, name:'목상자', icon:'📦' },
  pipe:    { w:2,d:1,h:1, wt:3, color:0x8a8a92, name:'강관',   icon:'⬛', heavy:true },
  glass:   { w:1,d:1,h:2, wt:1, color:0x88c0d0, name:'판유리', icon:'⚠️', fragile:true },
  machine: { w:1,d:1,h:1, wt:4, color:0x6a6e78, name:'기계',   icon:'⚙️', heavy:true },
};
// 화물 목록 (순서는 사용자가 자유롭게 — 넣는 순서가 곧 전략)
const MANIFEST = ['machine','drum','glass','glass','carton','crate','pipe','carton','drum','crate','glass','carton'];
const INV = MANIFEST.map(type=>({type, placed:false}));   // 인벤토리 (배치 상태)
let nextId = 0;

// ═══ 화물 3D 형상 빌더 (원점 중심, w×h×d 셀) ═══
function mkMesh(geo,color,rough=0.6,metal=0.1,opts={}){ const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,...opts}); return new THREE.Mesh(geo,m); }
function buildCargo(type,w,h,d){
  const t=TYPES[type], W=w*CELL*0.94, H=h*CELL*0.94, D=d*CELL*0.94, g=new THREE.Group();
  if(type==='drum'){
    const r=Math.min(W,D)*0.46;
    g.add(mkMesh(new THREE.CylinderGeometry(r,r,H*0.96,20), t.color,0.45,0.4));
    for(const yy of [H*0.32,-H*0.32]){ const ring=mkMesh(new THREE.CylinderGeometry(r*1.04,r*1.04,H*0.05,20),0x2a557a,0.5,0.5); ring.position.y=yy; g.add(ring); }
    const lid=mkMesh(new THREE.CylinderGeometry(r*0.42,r*0.42,H*0.05,12),0xd0d4dc,0.4,0.6); lid.position.y=H*0.48; g.add(lid);
  } else if(type==='pipe'){
    const pr=Math.min(H,D)*0.24;
    for(const [oy,oz] of [[0.42,0.4],[0.42,-0.4],[-0.42,0.4],[-0.42,-0.4],[0,0]]){
      const p=mkMesh(new THREE.CylinderGeometry(pr,pr,W*0.98,14), t.color,0.4,0.65); p.rotation.z=Math.PI/2; p.position.set(0,oy*H*0.5,oz*D*0.85); g.add(p); }
    for(const xx of [-W*0.34,W*0.34]){ const band=mkMesh(new THREE.TorusGeometry(Math.max(H,D)*0.42,0.025,6,18),0x2a2a30,0.5,0.3); band.rotation.y=Math.PI/2; band.position.x=xx; g.add(band); }
  } else if(type==='crate'){
    g.add(mkMesh(new THREE.BoxGeometry(W,H,D), t.color,0.85,0));
    const fr=0.055, fm=0x6a5230;
    for(const sx of [-1,1])for(const sz of [-1,1]){ const post=mkMesh(new THREE.BoxGeometry(fr,H*1.01,fr),fm,0.85); post.position.set(sx*W/2,0,sz*D/2); g.add(post); }
    for(const yy of [-H*0.42,H*0.42]){
      for(const sz of [-1,1]){ const b=mkMesh(new THREE.BoxGeometry(W*1.01,fr,fr),fm,0.85); b.position.set(0,yy,sz*D/2); g.add(b); }
      for(const sx of [-1,1]){ const b=mkMesh(new THREE.BoxGeometry(fr,fr,D*1.01),fm,0.85); b.position.set(sx*W/2,yy,0); g.add(b); }
    }
  } else if(type==='glass'){
    const pane=mkMesh(new THREE.BoxGeometry(W*0.9,H*0.82,D*0.16), t.color,0.15,0.1,{transparent:true,opacity:0.5}); pane.position.y=H*0.06; g.add(pane);
    g.add((()=>{ const b=mkMesh(new THREE.BoxGeometry(W,H*0.12,D),0x8a6a4a,0.85); b.position.y=-H*0.44; return b; })());
    for(const sx of [-W*0.42,W*0.42]){ const post=mkMesh(new THREE.BoxGeometry(0.05,H*0.85,0.05),0x8a6a4a,0.85); post.position.x=sx; g.add(post); }
  } else if(type==='machine'){
    const body=mkMesh(new THREE.BoxGeometry(W,H*0.72,D), t.color,0.5,0.55); body.position.y=-H*0.05; g.add(body);
    const top=mkMesh(new THREE.BoxGeometry(W*0.5,H*0.3,D*0.5),0x4a4e58,0.5,0.55); top.position.y=H*0.32; g.add(top);
    for(const sx of [-W*0.28,W*0.28]){ const pv=mkMesh(new THREE.CylinderGeometry(0.045,0.045,H*0.5,8),0x9aa0aa,0.4,0.6); pv.position.set(sx,H*0.15,D*0.28); g.add(pv); }
    const pal=mkMesh(new THREE.BoxGeometry(W*1.02,0.08,D*1.02),0x8a6a4a,0.9); pal.position.y=-H*0.5; g.add(pal);
  } else {   // carton
    g.add(mkMesh(new THREE.BoxGeometry(W,H,D), t.color,0.78,0));
    const tm=0x9a7550;
    const t1=mkMesh(new THREE.BoxGeometry(W*1.01,0.028,D*0.24),tm,0.6); t1.position.y=H*0.5; g.add(t1);
    const t2=mkMesh(new THREE.BoxGeometry(W*0.24,0.028,D*1.01),tm,0.6); t2.position.y=H*0.5; g.add(t2);
  }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  return g;
}
function ownerOf(o){ while(o){ if(o.userData&&o.userData.owner) return o.userData.owner; o=o.parent; } return null; }
function paintCargo(mesh,color,emissive){ mesh.traverse(o=>{ if(o.isMesh){ if(color!=null)o.material.color.setHex(color); if(emissive!=null)o.material.emissive.setHex(emissive); } }); }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141820);
scene.fog = new THREE.Fog(0x141820, 18, 44);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x33322c, 0.95));
const sun = new THREE.DirectionalLight(0xfff0e0, 1.05);
sun.position.set(5, 12, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-6, right:6, top:6, bottom:-6 });
scene.add(sun);

// 바다 (배 느낌)
const sea = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x1a3a4a, roughness: 0.4, metalness: 0.3 }));
sea.rotation.x = -Math.PI/2; sea.position.y = -0.4; sea.receiveShadow = true; scene.add(sea);

// ═══ 컨테이너 (con 그룹 = 롤링 축) ═══
const con = new THREE.Group(); scene.add(con);
const steel = new THREE.MeshStandardMaterial({ color: 0x2f5d92, roughness: 0.72, metalness: 0.28, side: THREE.DoubleSide });
const steelD = new THREE.MeshStandardMaterial({ color: 0x244a76, roughness: 0.7, metalness: 0.3 });
const floorPlate = new THREE.Mesh(new THREE.BoxGeometry(CON.L, 0.06, CON.W), steel);
floorPlate.position.y = 0.03; floorPlate.receiveShadow = true; con.add(floorPlate);
const glassMat = new THREE.MeshStandardMaterial({ color: 0x6ab0f0, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
function wall(w,h,rotY,x,z){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glassMat); m.rotation.y=rotY; m.position.set(x,h/2,z); con.add(m); }
wall(CON.L,CON.H,0,0,-CON.W/2); wall(CON.L,CON.H,0,0,CON.W/2);
const backW = new THREE.Mesh(new THREE.BoxGeometry(0.05,CON.H,CON.W), steel);
backW.position.set(-CON.L/2,CON.H/2,0); backW.castShadow=true; con.add(backW);
const roof = new THREE.Mesh(new THREE.PlaneGeometry(CON.L,CON.W),glassMat); roof.rotation.x=Math.PI/2; roof.position.y=CON.H; con.add(roof);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(CON.L,CON.H,CON.W)),
  new THREE.LineBasicMaterial({ color: 0x8fc0ff })); edges.position.y=CON.H/2; con.add(edges);
// 문 2짝
const bar = new THREE.MeshStandardMaterial({ color:0x9aa4b0, roughness:0.4, metalness:0.7 });
const doors=[];
function makeDoor(sign){ const p=new THREE.Group(); p.position.set(CON.L/2,0,sign*CON.W/2);
  const w=CON.W/2-0.02, cx=-sign*(w/2+0.01);
  const s=new THREE.Mesh(new THREE.BoxGeometry(0.05,CON.H-0.06,w),steel); s.position.set(0,CON.H/2,cx); s.castShadow=true; p.add(s);
  for(let i=0;i<4;i++){ const r=new THREE.Mesh(new THREE.BoxGeometry(0.055,CON.H-0.14,0.05),steelD); r.position.set(0.02,CON.H/2,-sign*(0.12+i*(w-0.24)/3)); p.add(r); }
  for(let b=0;b<2;b++){ const z=-sign*(w*0.32+b*w*0.36); const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.028,CON.H-0.18,10),bar); rod.position.set(0.06,CON.H/2,z); p.add(rod);
    const h=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.28,0.05),bar); h.position.set(0.11,CON.H*0.5,z); p.add(h); }
  con.add(p); doors.push({p,sign}); }
makeDoor(-1); makeDoor(1);
let doorOpen=1, doorTarget=1;

// ═══ 상태 ═══
const occ = {};   // "i,j,k" -> cargoId
const placed = [];   // {id, type, i,j,k, w,d,h, mesh, damaged, invIdx}
let curSel = 0, rot = 0;   // curSel: 선택된 인벤토리 인덱스, rot: 0/1 (90도)
let departed = false;
const itemById = id => placed.find(p=>p.id===id);
function nextUnplaced(from=0){ for(let k=0;k<INV.length;k++){ const idx=(from+k)%INV.length; if(!INV[idx].placed) return idx; } return -1; }
// 🏗 핸들링 비용 — 집어넣는 것도 돈이다 (크레인 1회 + 높이 + 대형)
let handCost = 0;
function handlingCost(w,h,k){ return 10 + k*6 + ((w*h)>1?5:0); }
function markInvPlaced(type){ const it=INV.find(x=>x.type===type&&!x.placed); if(it) it.placed=true; }
window.clearAll=()=>{
  placed.slice().forEach(p=>{ con.remove(p.mesh); if(p.mesh.userData.label) con.remove(p.mesh.userData.label); });
  placed.length=0; for(const kk in occ) delete occ[kk];
  INV.forEach(x=>x.placed=false); selectedP=null; curSel=0; handCost=0; departed=false;
  con.rotation.set(0,0,0); doorTarget=1; updateHUD();
};

const key = (i,j,k)=>`${i},${j},${k}`;
function footprint(type, rot){ const t=TYPES[type]; return rot? {w:t.d,d:t.w,h:t.h} : {w:t.w,d:t.d,h:t.h}; }

function canPlace(type,rot,i,j){
  const f=footprint(type,rot);
  if(i<0||j<0||i+f.w>CW||j+f.d>CD) return null;
  // 가장 낮은 지지 높이 찾기
  for(let k=0;k<=CH-f.h;k++){
    let ok=true, supported=(k===0);
    for(let di=0;di<f.w;di++)for(let dj=0;dj<f.d;dj++){
      for(let dk=0;dk<f.h;dk++) if(occ[key(i+di,j+dj,k+dk)]!==undefined) ok=false;
      if(k>0 && occ[key(i+di,j+dj,k-1)]!==undefined) supported=true;
    }
    if(ok && supported) return {i,j,k,...f};
  }
  return null;
}
function place(type,rot,i,j){
  const spot=canPlace(type,rot,i,j); if(!spot) return null;
  const t=TYPES[type], id=nextId++;
  const mesh=buildCargo(type, spot.w, spot.h, spot.d);
  mesh.position.set(
    OX*CELL + (spot.i+spot.w/2)*CELL,
    0.06 + (spot.k+spot.h/2)*CELL,
    OZ*CELL + (spot.j+spot.d/2)*CELL);
  con.add(mesh);
  // 라벨(fragile/heavy 아이콘 스프라이트)
  if(t.fragile||t.heavy){ const s=makeLabel(t.icon); s.position.copy(mesh.position); s.position.y+=spot.h*0.5+0.15; con.add(s); mesh.userData.label=s; }
  for(let di=0;di<spot.w;di++)for(let dj=0;dj<spot.d;dj++)for(let dk=0;dk<spot.h;dk++) occ[key(spot.i+di,spot.j+dj,spot.k+dk)]=id;
  const item={id,type,rot,...spot,mesh,damaged:false,invIdx:null};
  mesh.userData.owner=item;
  placed.push(item);
  return item;
}
// 셀 점유 갱신 (이동용)
function setOcc(p, val){ for(let di=0;di<p.w;di++)for(let dj=0;dj<p.d;dj++)for(let dk=0;dk<p.h;dk++){ if(val===null) delete occ[key(p.i+di,p.j+dj,p.k+dk)]; else occ[key(p.i+di,p.j+dj,p.k+dk)]=val; } }
function meshPos(p){ return new THREE.Vector3(OX*CELL+(p.i+p.w/2)*CELL, 0.06+(p.k+p.h/2)*CELL, OZ*CELL+(p.j+p.d/2)*CELL); }
function moveItem(p,i,j,k){ p.i=i;p.j=j;p.k=k; const pos=meshPos(p); p.mesh.position.copy(pos); if(p.mesh.userData.label){ p.mesh.userData.label.position.copy(pos); p.mesh.userData.label.position.y+=p.h*0.5+0.15; } setOcc(p,p.id); }
function highlight(p,on){ paintCargo(p.mesh, null, on?0x224466:0x000000); }
function makeLabel(txt){
  const cv=document.createElement('canvas'); cv.width=64;cv.height=64;
  const cx=cv.getContext('2d'); cx.font='44px sans-serif'; cx.textAlign='center'; cx.fillText(txt,32,46);
  const tx=new THREE.CanvasTexture(cv); const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false}));
  sp.scale.set(0.5,0.5,0.5); return sp;
}

window.rotateCargo=()=>{
  if(departed) return;
  if(selectedP){   // 선택 화물 제자리 회전 (유효하면)
    const p=selectedP, nr=p.rot^1;
    setOcc(p,null);
    const spot=canPlace(p.type,nr,p.i,p.j);
    if(spot){ const oldLabel=p.mesh.userData.label; con.remove(p.mesh);
      const t=TYPES[p.type];
      const mesh=buildCargo(p.type, spot.w, spot.h, spot.d);
      con.add(mesh);
      Object.assign(p,{rot:nr,w:spot.w,d:spot.d,h:spot.h,i:spot.i,j:spot.j,k:spot.k,mesh});
      mesh.userData.owner=p; if(oldLabel) mesh.userData.label=oldLabel;
      paintCargo(mesh,null,0x224466);   // 선택 하이라이트 유지
      moveItem(p,spot.i,spot.j,spot.k);
      flash('회전 완료');
    } else { setOcc(p,p.id); flash('회전할 공간이 없어요'); }
  } else { rot^=1; updateHUD(); flash('실을 방향: '+(rot?'세로':'가로')); }
};
window.undo=()=>{   // 선택 화물 제거 또는 마지막 것 → 화물 목록으로 반환
  if(departed) return;
  const p = selectedP || placed[placed.length-1];
  if(!p) return;
  con.remove(p.mesh); if(p.mesh.userData.label) con.remove(p.mesh.userData.label);
  setOcc(p,null);
  placed.splice(placed.indexOf(p),1);
  if(p.invIdx!=null){ INV[p.invIdx].placed=false; curSel=p.invIdx; }   // 목록으로 되돌리고 선택
  if(selectedP===p) selectedP=null;
  updateHUD(); flash('내렸어요 — 다시 실을 수 있어요');
};

// ═══ 출항 & 손상 판정 ═══
window.depart=()=>{
  if(departed) return;
  if(!placed.length){ flash('화물을 먼저 실으세요!'); return; }
  departed=true; doorTarget=0;   // 문 닫기
  flash('⚓ 출항! 항해 중…');
  setTimeout(sailAndJudge, 1400);
};
let rolling=0;
function sailAndJudge(){
  rolling=3.2;   // 3.2초 롤링
  setTimeout(()=>{
    // ── 손상 판정 ──
    let dmg=0;
    const cbmUsed = placed.reduce((a,p)=>a+p.w*p.d*p.h,0);
    const fillRate = cbmUsed / (CW*CD*CH);
    for(const p of placed){
      const t=TYPES[p.type]; let hit=false;
      // 1) 유리 위에 무엇이든 실림 → 눌림
      if(t.fragile){ for(let di=0;di<p.w;di++)for(let dj=0;dj<p.d;dj++) if(occ[key(p.i+di,p.j+dj,p.k+p.h)]!==undefined) hit=true; }
      // 2) 중량이 바닥이 아닌 곳(k>0)에 → 아래 화물 짓눌림
      if(t.heavy && p.k>0){ hit=true; const bId=occ[key(p.i,p.j,p.k-1)]; const below=bId!==undefined?itemById(bId):null; if(below) below.damaged=true; }
      // 3) 적재율 낮음 → 흔들림: 위·옆이 다 비어 안 끼인 화물 손상 확률
      if(fillRate<0.55){
        const topEmpty=occ[key(p.i,p.j,p.k+p.h)]===undefined && p.k+p.h<CH;
        const sideEmpty=(p.j===0&&occ[key(p.i,p.j+p.d,p.k)]===undefined&&p.j+p.d<CD);
        if(topEmpty && p.k+p.h<CH && Math.random()<0.45) hit=true;
      }
      if(hit) p.damaged=true;
    }
    placed.filter(p=>p.damaged).forEach(p=>{ paintCargo(p.mesh, 0xd03030, 0x551010); });
    doorTarget=1;   // 문 열어서 결과 공개
    setTimeout(()=>showResult(cbmUsed), 1000);
  }, 3400);
}
function showResult(cbmUsed){
  const dmgList=placed.filter(p=>p.damaged);
  const dmgCbm=dmgList.reduce((a,p)=>a+p.w*p.d*p.h,0);
  const loaded=placed.length, total=INV.length;
  const base=cbmUsed*100;
  const bonus=(nextUnplaced()<0)?500:0;   // 전량 적재 보너스
  const penalty=dmgCbm*220;
  const score=Math.max(0, base+bonus-penalty-handCost);
  document.getElementById('modalBody').innerHTML=
    `<h2>📋 하역 결과</h2>`+
    `적재: <b>${loaded}/${total}</b>개 · <b>${cbmUsed} CBM</b> (적재율 ${Math.round(cbmUsed/20*100)}%)<br>`+
    `${dmgList.length? `💥 손상: <b>${dmgList.length}개</b> (${dmgCbm} CBM)`:'✅ 무손상 완벽 배송!'} · 🏗 핸들링 ${handCost}<br><br>`+
    `<div style="font-size:13px;color:#666">적재 +${base} ${bonus?`· 완주 +${bonus} `:''}${penalty?`· 손상 -${penalty}`:''} · 핸들링 -${handCost}</div>`+
    `<div style="font-size:26px;margin-top:6px">최종 <b>${score}</b>점</div>`+
    (dmgList.length? `<div style="font-size:12px;color:#999;margin-top:6px">💡 유리(⚠️)는 위에 아무것도 얹지 말고, 중량(⬛)은 바닥에. 빈틈이 많으면 항해 중 흔들려요.</div>`
                   : `<div style="font-size:12px;color:#999;margin-top:6px">💡 핸들링을 줄이려면 재배치를 적게 — 한 번에 제자리에. 높이 쌓을수록 크레인 비용↑</div>`)+
    `<button onclick="location.reload()">🔄 다시 도전</button>`;
  document.getElementById('modal').style.display='flex';
}

// ═══ 입력 (탭 배치 / 드래그 시점) ═══
let camYaw=0.9, camPitch=0.72, camDist=11;
function updateCam(){ camPitch=Math.max(0.2,Math.min(1.4,camPitch)); camDist=Math.max(5,Math.min(22,camDist));
  camera.position.set(Math.sin(camYaw)*Math.cos(camPitch)*camDist, Math.sin(camPitch)*camDist+0.5, Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(0,CON.H/2,0); }
window.resetView=()=>{ camYaw=0.9; camPitch=0.72; camDist=11; updateCam(); };
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let mode=null,lastX=0,lastY=0,dX=0,dY=0,moved=false;
let grabP=null;            // down이 얹힌 배치 화물
let selectedP=null;        // 선택된 화물 (회전/삭제 대상)
function setNdc(x,y){ const r=canvas.getBoundingClientRect(); ndc.x=((x-r.left)/r.width)*2-1; ndc.y=-((y-r.top)/r.height)*2+1; ray.setFromCamera(ndc,camera); }
function pickCargo(x,y){ setNdc(x,y); const h=ray.intersectObjects(placed.map(p=>p.mesh),true)[0]; return h?ownerOf(h.object):null; }
function floorCell(x,y){ setNdc(x,y); const h=ray.intersectObjects([floorPlate,...placed.map(p=>p.mesh)],true)[0]; if(!h)return null;
  return { i:Math.floor(h.point.x-OX*CELL), j:Math.floor(h.point.z-OZ*CELL), pt:h.point }; }
function selectP(p){ if(selectedP) highlight(selectedP,false); selectedP=p; if(p){ highlight(p,true); flash(`선택: ${TYPES[p.type].icon} ${TYPES[p.type].name} — 드래그로 이동, ↻ 회전, ✕ 제거`); } }

function onDown(x,y){ dX=x;dY=y;lastX=x;lastY=y;moved=false;
  if(departed){ mode='orbit'; return; }
  grabP=pickCargo(x,y); mode='down'; }
function onMove(x,y){
  if(!mode)return;
  if(!moved && Math.abs(x-dX)+Math.abs(y-dY)>5) moved=true;
  if(mode==='down' && moved){ mode = grabP ? 'drag' : 'orbit'; if(mode==='drag'){ selectP(grabP); setOcc(grabP,null); } }
  if(mode==='orbit'){ camYaw-=(x-lastX)*0.006; camPitch+=(y-lastY)*0.006; updateCam(); }
  else if(mode==='drag' && grabP){ const fc=floorCell(x,y); if(fc){ grabP.mesh.position.set(OX*CELL+(fc.i+grabP.w/2)*CELL, CON.H+0.4, OZ*CELL+(fc.j+grabP.d/2)*CELL); } }
  lastX=x;lastY=y;
}
function onUp(x,y){
  if(mode==='down' && !moved){        // 탭
    if(grabP) selectP(selectedP===grabP?null:grabP);   // 화물 탭 = 선택/해제
    else tapPlace(x,y);                                // 빈 곳 탭 = 큐 배치
  } else if(mode==='drag' && grabP){  // 드래그 놓기 = 재배치
    dropGrab(x,y);
  }
  mode=null; grabP=null;
}
function dropGrab(x,y){
  const fc=floorCell(x,y);
  const orig={i:grabP.i,j:grabP.j,k:grabP.k};
  let ok=false;
  if(fc){ const spot=canPlace(grabP.type,grabP.rot,fc.i,fc.j); if(spot){ moveItem(grabP,spot.i,spot.j,spot.k); handCost+=8; ok=true; updateHUD(); } }   // 재배치도 비용
  if(!ok){ moveItem(grabP,orig.i,orig.j,orig.k); flash('그 자리엔 안 들어가요 — 제자리로'); }
}
function tapPlace(x,y){
  if(departed) return;
  if(curSel<0||INV[curSel].placed){ curSel=nextUnplaced(); }
  if(curSel<0){ flash('화물을 다 실었어요 — ⚓ 출항!'); return; }
  const fc=floorCell(x,y); if(!fc) return;
  const inv=INV[curSel];
  const p=place(inv.type,rot,fc.i,fc.j);
  if(p){ inv.placed=true; p.invIdx=curSel; handCost+=handlingCost(p.w,p.h,p.k); curSel=nextUnplaced(curSel); updateHUD(); }
  else flash('여기엔 안 들어가요 (공간 부족/지지 없음)');
}
window.pickInv=(idx)=>{ if(departed||INV[idx].placed||replayTimer) return; curSel=idx; updateHUD(); flash(`선택: ${TYPES[INV[idx].type].icon} ${TYPES[INV[idx].type].name} — 바닥에 탭!`); };

// ═══ 🤖 AI 최적 적재 솔버 (휴리스틱: 무거운·큰 것 먼저 바닥, 유리 마지막 위로, 빈틈 최소) ═══
function vLowestK(vocc,f,i,j){ for(let k=0;k<=CH-f.h;k++){ let ok=true,sup=(k===0);
  for(let di=0;di<f.w;di++)for(let dj=0;dj<f.d;dj++){ for(let dk=0;dk<f.h;dk++) if(vocc[key(i+di,j+dj,k+dk)]!==undefined) ok=false; if(k>0&&vocc[key(i+di,j+dj,k-1)]!==undefined) sup=true; }
  if(ok&&sup) return k; } return -1; }
function solveOptimal(){
  const items=INV.map((x,idx)=>({type:x.type,idx,...TYPES[x.type]}));
  items.sort((a,b)=>{ if(!!a.fragile!==!!b.fragile) return a.fragile?1:-1;      // 유리는 맨 나중
    if(!!a.heavy!==!!b.heavy) return a.heavy?-1:1;                             // 중량은 먼저(바닥)
    return (b.w*b.d*b.h)-(a.w*a.d*a.h); });                                    // 큰 것 먼저
  const vocc={}, plan=[];
  for(const it of items){ let best=null;
    for(const rr of [0,1]){ const f=footprint(it.type,rr);
      for(let i=0;i<=CW-f.w;i++)for(let j=0;j<=CD-f.d;j++){ const k=vLowestK(vocc,f,i,j); if(k<0)continue;
        let sc = it.fragile? k*20 : -k*20;   // 유리는 높이, 나머지는 낮게
        sc -= (i*2+j);                        // 안쪽·왼쪽부터 채우기
        if(!best||sc>best.sc) best={sc,i,j,k,rot:rr,f}; } }
    if(best){ for(let di=0;di<best.f.w;di++)for(let dj=0;dj<best.f.d;dj++)for(let dk=0;dk<best.f.h;dk++) vocc[key(best.i+di,best.j+dj,best.k+dk)]=it.idx;
      plan.push({type:it.type,rot:best.rot,i:best.i,j:best.j}); } }
  return plan;
}
let replayTimer=null;
window.aiDemo=()=>{
  if(replayTimer||departed) return;
  clearAll();
  const plan=solveOptimal();
  flash('🤖 AI가 최적 순서로 적재하는 중…'); let idx=0;
  replayTimer=setInterval(()=>{
    if(idx>=plan.length){ clearInterval(replayTimer); replayTimer=null; setTimeout(()=>depart(), 800); return; }
    const s=plan[idx++]; const p=place(s.type,s.rot,s.i,s.j);
    if(p){ markInvPlaced(s.type); handCost+=handlingCost(p.w,p.h,p.k); p.fall=2.6; updateHUD(); }
  }, 400);
};
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId);}catch(_){}onDown(e.clientX,e.clientY);});
canvas.addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
canvas.addEventListener('pointerup',e=>onUp(e.clientX,e.clientY));
canvas.addEventListener('wheel',e=>{camDist+=e.deltaY*0.01;updateCam();},{passive:true});
let pinch=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=pd(e);},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=pd(e);camDist*=pinch/d;pinch=d;updateCam();}},{passive:true});
function pd(e){return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}

// ═══ HUD ═══
function updateHUD(){
  const cbm=placed.reduce((a,p)=>a+p.w*p.d*p.h,0);
  const remain=INV.filter(x=>!x.placed).length;
  document.getElementById('score').innerHTML=`📦 적재 <b>${placed.length}/${INV.length}</b> · <b>${cbm}/20 CBM</b> · 🏗 핸들링 <b>${handCost}</b><br>남은 화물: ${remain}개 (골라 실으세요 · 🤖로 AI 시연)`;
  // 화물 목록 — 클릭해서 선택, 배치된 건 흐리게
  document.getElementById('next').innerHTML=INV.map((item,idx)=>{
    const T=TYPES[item.type]; const cls=item.placed?'done':idx===curSel?'cur':'';
    return `<div class="card ${cls}" onclick="pickInv(${idx})">${T.icon}<br>${T.name}</div>`;
  }).join('');
  const cur = curSel>=0 && !INV[curSel]?.placed ? INV[curSel] : null;
  document.getElementById('bottom').innerHTML = remain>0
    ? (cur? `<button class="hot" onclick="pickInv(${curSel})">실을 화물: ${TYPES[cur.type].icon} ${TYPES[cur.type].name} <span style="opacity:.7">(${footprint(cur.type,rot).w}×${footprint(cur.type,rot).d}×${TYPES[cur.type].h})</span> — 바닥 탭!</button>`
             : `<button class="hot">↑ 화물 목록에서 실을 것을 고르세요</button>`)
    : `<button class="go" onclick="depart()">⚓ 다 실었다! 출항</button>`;
}
let ht; function flash(m){ const h=document.getElementById('hint'); h.textContent=m; clearTimeout(ht); ht=setTimeout(()=>h.textContent='바닥 탭=놓기 · 화물 탭=선택 · 화물 드래그=이동 · ↻회전 · ↩제거',2400); }

// ═══ 🔍 화물 인스펙터 (별도 3D 뷰 — 클릭한 화물 확인 + 돌려보기) ═══
const insCanvas=document.getElementById('ic');
const insR=new THREE.WebGLRenderer({canvas:insCanvas,antialias:true,alpha:true});
insR.setPixelRatio(Math.min(devicePixelRatio,2));
const insS=new THREE.Scene();
insS.add(new THREE.HemisphereLight(0xffffff,0x445,1.15));
const il=new THREE.DirectionalLight(0xffffff,0.95); il.position.set(3,5,4); insS.add(il);
const insC=new THREE.PerspectiveCamera(38,1,0.1,50);
let insMesh=null, insYaw=0.6, insPitch=0.35, insActive=false, insAuto=true, idrag=false, ilx=0, ily=0;
function sizeIns(){ const s=Math.min(300, Math.floor(innerWidth*0.72)); insCanvas.style.width=s+'px'; insCanvas.style.height=s+'px'; insR.setSize(s,s,false); insC.aspect=1; insC.updateProjectionMatrix(); }
window.openInspector=(type)=>{
  const t=TYPES[type];
  if(insMesh) insS.remove(insMesh);
  insMesh=buildCargo(type,t.w,t.h,t.d); insS.add(insMesh);
  const maxd=Math.max(t.w,t.h,t.d); insC.position.set(0, t.h*0.15, maxd*2.5); insC.lookAt(0,0,0);
  document.getElementById('iinfo').innerHTML=
    `<b>${t.icon} ${t.name}</b><br>규격 ${t.w}×${t.d}×${t.h} m · <b>${t.w*t.d*t.h} CBM</b><br>`+
    `무게 등급 ${t.wt}${t.fragile?' · <span style="color:#ecc94b">⚠️ 취급주의(깨짐)</span>':''}${t.heavy?' · <span style="color:#e0705a">⬛ 중량물</span>':''}`;
  document.getElementById('inspector').style.display='flex';
  insActive=true; insAuto=true; insYaw=0.6; insPitch=0.35; sizeIns();
};
window.closeInspector=()=>{ document.getElementById('inspector').style.display='none'; insActive=false; };
window.inspectSel=()=>{
  let type=null;
  if(selectedP) type=selectedP.type;
  else if(curSel>=0 && INV[curSel] && !INV[curSel].placed) type=INV[curSel].type;
  if(type) openInspector(type); else flash('화물을 먼저 선택하세요 (목록 카드나 실린 화물 탭)');
};
insCanvas.addEventListener('pointerdown',e=>{ idrag=true; insAuto=false; ilx=e.clientX; ily=e.clientY; e.stopPropagation(); });
addEventListener('pointermove',e=>{ if(!idrag)return; insYaw+=(e.clientX-ilx)*0.012; insPitch+=(e.clientY-ily)*0.012; insPitch=Math.max(-1.3,Math.min(1.3,insPitch)); ilx=e.clientX; ily=e.clientY; });
addEventListener('pointerup',()=>{ idrag=false; });

function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); if(insActive) sizeIns(); }
addEventListener('resize',resize);
resize(); updateCam(); updateHUD();
let t=0;
renderer.setAnimationLoop(()=>{
  // 문
  if(Math.abs(doorOpen-doorTarget)>0.001){ doorOpen+=(doorTarget-doorOpen)*0.12; for(const d of doors) d.p.rotation.y=-d.sign*doorOpen*Math.PI*0.82; }
  // 항해 롤링
  if(rolling>0){ rolling-=1/60; t+=0.08; con.rotation.z=Math.sin(t)*0.09; con.rotation.x=Math.sin(t*0.7)*0.05; if(rolling<=0){con.rotation.z=0;con.rotation.x=0;} }
  // 🤖 리플레이 낙하 연출
  for(const p of placed){ if(p.fall>0){ p.mesh.position.y=(0.06+(p.k+p.h/2)*CELL)+p.fall; p.fall*=0.8; if(p.fall<0.02){ p.fall=0; p.mesh.position.y=0.06+(p.k+p.h/2)*CELL; } } }
  renderer.render(scene,camera);
  // 🔍 인스펙터 렌더 (열렸을 때만)
  if(insActive && insMesh){ if(insAuto) insYaw+=0.008; insMesh.rotation.y=insYaw; insMesh.rotation.x=insPitch; insR.render(insS,insC); }
});
</script>
