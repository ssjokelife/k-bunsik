<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📦 3D 배치 데모 — 방과후 스튜디오</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0e1015;
    font-family:'Malgun Gothic',sans-serif; color:#dde; touch-action:none; }
  #c { display:block; width:100%; height:100%; }
  #hud { position:fixed; top:0; left:0; right:0; padding:10px 12px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(rgba(14,16,21,.9), transparent); z-index:5; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  h1 { font-size:15px; margin:0; color:#ffd08a; }
  .tag { font-size:11px; color:#889; }
  button { background:#242a36; color:#dde; border:1px solid #3a4356; border-radius:9px;
    padding:9px 12px; font-size:13px; font-family:inherit; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.hot { background:#e8734f; color:#fff; border:0; }
  button.on { border-color:#ecc94b; color:#ecc94b; }
  #palette { position:fixed; bottom:0; left:0; right:0; padding:10px;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(14,16,21,.92)); z-index:5; }
  #palette button { min-width:64px; }
  #hint { position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); border-radius:10px; padding:6px 14px; font-size:12.5px;
    color:#cdd8ee; z-index:5; white-space:nowrap; }
  #info { position:fixed; top:44px; right:10px; font-size:11.5px; color:#8fb8e8;
    background:rgba(0,0,0,.4); border-radius:8px; padding:4px 9px; z-index:5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>📦 3D 배치 데모</h1>
  <span class="tag">방과후 스튜디오 · 프로토타입</span>
  <span style="flex:1"></span>
  <button id="rotBtn" onclick="rotateSel()">↻ 회전</button>
  <button id="delBtn" onclick="delSel()">🗑 삭제</button>
  <button onclick="saveScene()">💾 저장</button>
  <button onclick="resetView()">🎥 시점</button>
</div>
<div id="info"></div>
<div id="hint">바닥의 박스 버튼을 눌러 놓고 · 드래그로 이동 · 빈 곳 드래그로 카메라 회전</div>
<div id="palette">
  <button class="hot" onclick="addBox('#e8734f','상자')">📦 상자</button>
  <button onclick="addBox('#5aa0e8','컨테이너', 1.4, .8, .8)">🚢 컨테이너</button>
  <button onclick="addBox('#7fd18a','테이블', 1.2, .5, .8)">🪑 테이블</button>
  <button onclick="addBox('#ecc94b','상품', .5, .7, .5)">🎁 상품</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141820);
scene.fog = new THREE.Fog(0x141820, 14, 30);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
const GRID = 10, HALF = GRID / 2;

// 조명
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x33322c, 0.9));
const sun = new THREE.DirectionalLight(0xfff0e0, 1.1);
sun.position.set(6, 12, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);

// 바닥 + 격자
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(GRID, GRID),
  new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(GRID, GRID, 0x445, 0x334);
grid.position.y = 0.01; scene.add(grid);

// 카메라 궤도 (오빗)
let camYaw = 0.7, camPitch = 0.9, camDist = 13;
function updateCam() {
  camPitch = Math.max(0.25, Math.min(1.45, camPitch));
  camDist = Math.max(6, Math.min(24, camDist));
  camera.position.set(
    Math.sin(camYaw) * Math.cos(camPitch) * camDist,
    Math.sin(camPitch) * camDist,
    Math.cos(camYaw) * Math.cos(camPitch) * camDist);
  camera.lookAt(0, 0.5, 0);
}
window.resetView = () => { camYaw = 0.7; camPitch = 0.9; camDist = 13; updateCam(); };

// 배치된 물건들
const items = [];
let selected = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();

function snap(v) { return Math.round(v - 0.5) + 0.5; }   // 1칸 격자 스냅

window.addBox = (color, label, w = 1, h = 1, d = 1) => {
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(0.5, h / 2, 0.5);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = { label, w, h, d, baseColor: color };
  scene.add(mesh); items.push(mesh);
  select(mesh);
  flashInfo(`${label} 추가 — 드래그로 이동, ↻로 회전`);
};

function select(mesh) {
  if (selected) selected.material.emissive.setHex(0x000000);
  selected = mesh;
  if (mesh) { mesh.material.emissive.setHex(0x443300); }
  updateInfo();
}
window.rotateSel = () => {
  if (!selected) return flashInfo('먼저 물건을 선택하세요');
  selected.rotation.y += Math.PI / 2;
};
window.delSel = () => {
  if (!selected) return;
  scene.remove(selected); items.splice(items.indexOf(selected), 1);
  select(null); flashInfo('삭제됨');
};
window.saveScene = () => {
  const data = items.map(m => ({ label: m.userData.label, color: m.userData.baseColor,
    x: +m.position.x.toFixed(2), z: +m.position.z.toFixed(2),
    ry: +(m.rotation.y).toFixed(2), w: m.userData.w, h: m.userData.h, d: m.userData.d }));
  localStorage.setItem('place3d', JSON.stringify(data));
  flashInfo(`💾 ${data.length}개 배치 저장됨`);
};
function load() {
  try {
    const data = JSON.parse(localStorage.getItem('place3d') || '[]');
    data.forEach(o => {
      const mat = new THREE.MeshStandardMaterial({ color: o.color, roughness: 0.6, metalness: 0.1 });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(o.w, o.h, o.d), mat);
      mesh.position.set(o.x, o.h / 2, o.z); mesh.rotation.y = o.ry;
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.userData = { label: o.label, w: o.w, h: o.h, d: o.d, baseColor: o.color };
      scene.add(mesh); items.push(mesh);
    });
    if (data.length) flashInfo(`저장된 배치 ${data.length}개 불러옴`);
  } catch (e) {}
}

const infoEl = document.getElementById('info');
function updateInfo() { infoEl.textContent = `배치 ${items.length}개` + (selected ? ` · 선택: ${selected.userData.label}` : ''); }
let hintTimer;
function flashInfo(msg) {
  const h = document.getElementById('hint'); h.textContent = msg;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { h.textContent = '박스 버튼으로 놓고 · 드래그 이동 · 빈 곳 드래그로 카메라'; }, 2200);
  updateInfo();
}

// ── 입력: 물건 드래그 vs 카메라 궤도
let mode = null;   // 'drag' | 'orbit' | null
let dragMesh = null, lastX = 0, lastY = 0;
let downX = 0, downY = 0, moved = false;

function pick(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster.intersectObjects(items, false);
}
function floorPoint(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(floor, false)[0];
  return hit ? hit.point : null;
}

function onDown(x, y) {
  downX = x; downY = y; moved = false; lastX = x; lastY = y;
  const hits = pick(x, y);
  if (hits.length) { mode = 'drag'; dragMesh = hits[0].object; select(dragMesh); }
  else { mode = 'orbit'; }
}
function onMove(x, y) {
  if (!mode) return;
  if (Math.abs(x - downX) + Math.abs(y - downY) > 4) moved = true;
  if (mode === 'orbit') {
    camYaw -= (x - lastX) * 0.006;
    camPitch += (y - lastY) * 0.006;
    updateCam();
  } else if (mode === 'drag' && dragMesh) {
    const p = floorPoint(x, y);
    if (p) {
      dragMesh.position.x = Math.max(-HALF + .5, Math.min(HALF - .5, snap(p.x)));
      dragMesh.position.z = Math.max(-HALF + .5, Math.min(HALF - .5, snap(p.z)));
    }
  }
  lastX = x; lastY = y;
}
function onUp() {
  if (mode === 'orbit' && !moved) select(null);   // 빈 곳 탭 = 선택 해제
  mode = null; dragMesh = null;
}

canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY); });
canvas.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('wheel', e => { camDist += e.deltaY * 0.01; updateCam(); }, { passive: true });
// 핀치 줌 (2손가락)
let pinchStart = 0;
canvas.addEventListener('touchstart', e => { if (e.touches.length === 2) pinchStart = pinchDist(e); }, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) { const d = pinchDist(e); camDist *= pinchStart / d; pinchStart = d; updateCam(); }
}, { passive: true });
function pinchDist(e) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; return Math.hypot(dx, dy); }

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

resize(); updateCam(); load(); updateInfo();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
