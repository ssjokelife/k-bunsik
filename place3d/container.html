<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🚢 컨테이너 적재 시뮬 — 방과후 스튜디오</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0e1015;
    font-family:'Malgun Gothic',sans-serif; color:#dde; touch-action:none; }
  #c { display:block; width:100%; height:100%; }
  #hud { position:fixed; top:0; left:0; right:0; padding:9px 12px;
    display:flex; gap:7px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(rgba(14,16,21,.92), transparent); z-index:5; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  h1 { font-size:14px; margin:0; color:#ffd08a; }
  button { background:#242a36; color:#dde; border:1px solid #3a4356; border-radius:9px;
    padding:8px 11px; font-size:13px; font-family:inherit; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.hot { background:#5aa0e8; color:#fff; border:0; }
  #stats { position:fixed; top:42px; left:10px; font-size:12px; line-height:1.6;
    background:rgba(0,0,0,.5); border-radius:10px; padding:8px 12px; z-index:5; }
  #stats b { color:#ecc94b; }
  #stats .fill { height:7px; border-radius:4px; background:#222; margin-top:4px; overflow:hidden; width:150px; }
  #stats .fill i { display:block; height:100%; background:linear-gradient(90deg,#e8a15a,#7fd18a); }
  #palette { position:fixed; bottom:0; left:0; right:0; padding:10px;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(transparent, rgba(14,16,21,.92)); z-index:5; }
  #hint { position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.6); border-radius:10px; padding:6px 14px; font-size:12px;
    color:#cdd8ee; z-index:5; white-space:nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>🚢 컨테이너 적재 시뮬</h1>
  <span style="flex:1"></span>
  <button onclick="toggleDoor()">🚪 문</button>
  <button onclick="autoFill()">⚡ 자동적재</button>
  <button onclick="clearAll()">🗑 비우기</button>
  <button onclick="resetView()">🎥 시점</button>
</div>
<div id="stats"></div>
<div id="hint">📦 버튼으로 1CBM 박스 추가 · 드래그로 이동 · 빈 곳 드래그로 시점 회전</div>
<div id="palette">
  <button class="hot" onclick="addBox()">📦 1CBM 박스 추가</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ═══ 실물 규격 (ISO 20ft GP, 미터) ═══
const CON = { L: 5.90, W: 2.35, H: 2.39 };   // 내부 치수
const BOX = 1.0;                              // 1CBM 정육면체 한 변
const CON_CBM = 33.2;                         // 컨테이너 내용적
const MAXBOX = Math.floor(CON.L / BOX) * Math.floor(CON.W / BOX) * Math.floor(CON.H / BOX);  // = 20

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141820);
scene.fog = new THREE.Fog(0x141820, 16, 40);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x33322c, 0.95));
const sun = new THREE.DirectionalLight(0xfff0e0, 1.05);
sun.position.set(5, 11, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-6, right:6, top:6, bottom:-6 });
scene.add(sun);

// 바닥
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x252a34, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// ═══ 컨테이너 (반투명 벽 + 뼈대), 원점 = 컨테이너 좌하단 앞 모서리 기준 → 중앙 정렬 ═══
const con = new THREE.Group();
// 바닥 판
const floorPlate = new THREE.Mesh(new THREE.BoxGeometry(CON.L, 0.05, CON.W),
  new THREE.MeshStandardMaterial({ color: 0x3a4658, roughness: 0.8 }));
floorPlate.position.set(0, 0.025, 0); floorPlate.receiveShadow = true; con.add(floorPlate);
// 코러게이션(주름 강판) 벽 — 뒷면·좌우는 불투명 강판, 세로 주름
const steelMat = new THREE.MeshStandardMaterial({ color: 0x2f5d92, roughness: 0.72, metalness: 0.28, side: THREE.DoubleSide });
const steelDark = new THREE.MeshStandardMaterial({ color: 0x244a76, roughness: 0.7, metalness: 0.3 });
function corrugatedWall(w, h) {   // 주름벽: 평판 + 세로 리브 (로컬 xy평면, 두께 z)
  const g = new THREE.Group();
  const skin = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), steelMat);
  g.add(skin);
  const ribs = Math.max(4, Math.round(w / 0.35));
  for (let i = 0; i < ribs; i++) {
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.05, h - 0.08, 0.05), steelDark);
    rib.position.set(-w/2 + (i + 0.5) * (w / ribs), 0, 0.03);
    g.add(rib);
  }
  return g;
}
// 뒷면(불투명 강판)
const back = corrugatedWall(CON.W, CON.H);
back.rotation.y = Math.PI/2; back.position.set(-CON.L/2, CON.H/2, 0);
back.traverse(o => o.castShadow = true); con.add(back);
// 좌우(반투명 — 내부 박스 보이게)
const glass = new THREE.MeshStandardMaterial({ color: 0x6ab0f0, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
const leftW = new THREE.Mesh(new THREE.PlaneGeometry(CON.L, CON.H), glass);
leftW.position.set(0, CON.H/2, -CON.W/2); con.add(leftW);
const rightW = leftW.clone(); rightW.position.z = CON.W/2; con.add(rightW);
// 지붕(반투명)
const roof = new THREE.Mesh(new THREE.PlaneGeometry(CON.L, CON.W), glass);
roof.rotation.x = Math.PI/2; roof.position.set(0, CON.H, 0); con.add(roof);
// 뼈대 라인 (컨테이너 코너 포스트)
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(CON.L, CON.H, CON.W)),
  new THREE.LineBasicMaterial({ color: 0x8fc0ff }));
edges.position.y = CON.H/2; con.add(edges);

// ═══ 🚪 뒷문 — 양쪽 여닫이 2짝 (실제 20ft: 코러게이션 강판 + 수직 잠금바 + 손잡이 + 힌지) ═══
const barMat = new THREE.MeshStandardMaterial({ color: 0x9aa4b0, roughness: 0.4, metalness: 0.7 });
const doors = [];   // {pivot, sign}
function makeDoor(sign) {   // sign=+1: z+쪽 힌지 문짝, -1: z-쪽 힌지 문짝
  const pivot = new THREE.Group();
  pivot.position.set(CON.L/2, 0, sign * CON.W/2);   // 앞면(+x)의 힌지 모서리
  const panel = new THREE.Group();
  const w = CON.W/2 - 0.015;
  const cx = -sign * (w/2 + 0.01);   // 문짝 중심(힌지에서 안쪽으로)
  // 강판 (주름)
  const skin = new THREE.Mesh(new THREE.BoxGeometry(0.05, CON.H - 0.06, w), steelMat);
  skin.position.set(0, CON.H/2, cx); skin.castShadow = true; panel.add(skin);
  const ribs = 4;
  for (let i = 0; i < ribs; i++) {
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.055, CON.H - 0.14, 0.05), steelDark);
    rib.position.set(0.02, CON.H/2, -sign * (0.12 + i * (w - 0.24) / (ribs - 1)));
    panel.add(rib);
  }
  // 수직 잠금바 2개 + 손잡이
  for (let b = 0; b < 2; b++) {
    const zoff = -sign * (w * 0.32 + b * w * 0.36);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, CON.H - 0.18, 10), barMat);
    rod.position.set(0.06, CON.H/2, zoff); rod.castShadow = true; panel.add(rod);
    // 캠(위·아래)
    for (const yy of [0.12, CON.H - 0.12]) {
      const cam = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.06), barMat);
      cam.position.set(0.07, yy, zoff); panel.add(cam);
    }
    // 손잡이
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.28, 0.05), barMat);
    handle.position.set(0.11, CON.H * 0.5, zoff); panel.add(handle);
  }
  // 힌지 (문짝 바깥 모서리 = 힌지 위치, 위·아래)
  for (const yy of [0.25, CON.H/2, CON.H - 0.25]) {
    const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 8), barMat);
    hinge.position.set(0.02, yy, 0); panel.add(hinge);
  }
  pivot.add(panel);
  con.add(pivot);
  doors.push({ pivot, sign });
  return pivot;
}
makeDoor(-1); makeDoor(+1);
let doorOpen = 1, doorTarget = 1;   // 0 닫힘, 1 열림 (기본 열림 — 적재 중)
window.toggleDoor = () => { doorTarget = doorTarget > 0.5 ? 0 : 1;
  flash(doorTarget ? '🚪 문 열림 — 적재 가능' : '🚪 문 닫힘 — 봉인'); };

scene.add(con);

// 격자 (컨테이너 바닥 1m 셀)
const cellW = Math.floor(CON.L / BOX), cellD = Math.floor(CON.W / BOX);   // 5 x 2

// ═══ 박스 관리 ═══
const boxes = [];
function boxColor(n) { const h = (n * 47) % 360; return new THREE.Color(`hsl(${h},55%,58%)`); }

// 컨테이너 좌표계: x는 -CON.L/2..+CON.L/2, z는 -CON.W/2..+CON.W/2
// 셀 (i,j,k): 중심 x = -CON.L/2 + (i+0.5), z = -CON.W/2 + (j+0.5), y = 0.05 + k + 0.5
function cellCenter(i, j, k) {
  return new THREE.Vector3(
    -CON.L/2 + i + BOX/2,
    0.05 + k * BOX + BOX/2,
    -CON.W/2 + j + BOX/2);
}
function firstEmpty() {
  const occ = new Set(boxes.map(b => b.userData.cell));
  const maxK = Math.floor(CON.H / BOX);   // 2단
  for (let k = 0; k < maxK; k++)
    for (let i = 0; i < cellW; i++)
      for (let j = 0; j < cellD; j++)
        if (!occ.has(`${i},${j},${k}`)) return { i, j, k };
  return null;
}
window.addBox = () => {
  const c = firstEmpty();
  if (!c) { flash('🚫 컨테이너 만석! 1CBM 박스로는 20개가 한계 (데드스페이스)'); return; }
  const m = new THREE.Mesh(new THREE.BoxGeometry(BOX*0.98, BOX*0.98, BOX*0.98),
    new THREE.MeshStandardMaterial({ color: boxColor(boxes.length), roughness: 0.55 }));
  m.position.copy(cellCenter(c.i, c.j, c.k));
  m.castShadow = true; m.receiveShadow = true;
  m.userData = { cell: `${c.i},${c.j},${c.k}` };
  con.add(m); boxes.push(m);
  updateStats();
};
window.autoFill = () => { let g = 0; while (firstEmpty() && g++ < 30) addBox(); flash(`⚡ ${boxes.length}개 적재 완료`); };
window.clearAll = () => { boxes.forEach(b => con.remove(b)); boxes.length = 0; updateStats(); flash('비웠습니다'); };

// ═══ 카메라 궤도 ═══
let camYaw = 0.9, camPitch = 0.7, camDist = 11;
function updateCam() {
  camPitch = Math.max(0.2, Math.min(1.4, camPitch));
  camDist = Math.max(4, Math.min(24, camDist));
  camera.position.set(Math.sin(camYaw)*Math.cos(camPitch)*camDist, Math.sin(camPitch)*camDist + 0.5, Math.cos(camYaw)*Math.cos(camPitch)*camDist);
  camera.lookAt(0, CON.H/2, 0);
}
window.resetView = () => { camYaw = 0.9; camPitch = 0.7; camDist = 11; updateCam(); };

// ═══ 통계 ═══
function updateStats() {
  const n = boxes.length;
  const usedCbm = n * 1;
  const rate = Math.round(usedCbm / CON_CBM * 100);
  document.getElementById('stats').innerHTML =
    `🚢 <b>20ft 컨테이너</b> (5.9×2.35×2.39m, ${CON_CBM} CBM)<br>` +
    `📦 적재: <b>${n}</b> / ${MAXBOX} 박스 (1CBM씩)<br>` +
    `📊 실적재: <b>${usedCbm} CBM</b> · 적재율 <b>${rate}%</b><br>` +
    `<span style="color:#e8a15a">💨 데드스페이스 ${(CON_CBM - usedCbm).toFixed(1)} CBM 손실</span>` +
    `<div class="fill"><i style="width:${rate}%"></i></div>`;
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let mode = null, lastX = 0, lastY = 0, downX = 0, downY = 0, moved = false;
function onDown(x, y) { downX = x; downY = y; lastX = x; lastY = y; moved = false; mode = 'orbit'; }
function onMove(x, y) {
  if (!mode) return;
  if (Math.abs(x-downX)+Math.abs(y-downY) > 4) moved = true;
  camYaw -= (x-lastX)*0.006; camPitch += (y-lastY)*0.006; updateCam();
  lastX = x; lastY = y;
}
function onUp() { mode = null; }
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY); });
canvas.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('wheel', e => { camDist += e.deltaY*0.01; updateCam(); }, { passive: true });
let pinch = 0;
canvas.addEventListener('touchstart', e => { if (e.touches.length===2) pinch = pd(e); }, { passive:true });
canvas.addEventListener('touchmove', e => { if (e.touches.length===2){ const d=pd(e); camDist*=pinch/d; pinch=d; updateCam(); } }, { passive:true });
function pd(e){ return Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }

let ht;
function flash(msg){ const h=document.getElementById('hint'); h.textContent=msg; clearTimeout(ht); ht=setTimeout(()=>h.textContent='📦 버튼으로 1CBM 박스 추가 · 빈 곳 드래그로 시점 회전', 2600); }

function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
resize(); updateCam(); updateStats();
renderer.setAnimationLoop(() => {
  // 🚪 문 여닫이 보간 (힌지 회전) — 실제 컨테이너처럼 바깥(+x)으로 활짝
  if (Math.abs(doorOpen - doorTarget) > 0.001) {
    doorOpen += (doorTarget - doorOpen) * 0.12;
    for (const d of doors) d.pivot.rotation.y = -d.sign * doorOpen * Math.PI * 0.82;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
