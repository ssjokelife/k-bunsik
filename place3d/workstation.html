<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🚢 한바다 콘솔 — CFS 업무 PC</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Malgun Gothic','Segoe UI',sans-serif;
    background:linear-gradient(#1a2030 0%,#232a3c 55%,#3a3324 55%,#2a2418 100%);color:#e8ecf2;}
  #topbar{position:fixed;top:0;left:0;right:0;height:34px;z-index:40;display:flex;align-items:center;gap:12px;
    padding:0 12px;background:linear-gradient(#0b1a2e,#0d2038);border-bottom:1px solid #06101f;font-size:12.5px;}
  #topbar b{color:#7fc0ff;} .tspacer{flex:1;}
  #topbar .chip{background:rgba(255,255,255,.06);padding:3px 9px;border-radius:7px;}
  #desk{position:absolute;inset:34px 0 0 0;display:flex;align-items:center;justify-content:center;gap:3vw;padding:2vh 3vw 8vh;}
  .monitor{position:relative;flex:0 0 auto;width:44vw;max-width:760px;transition:all .45s cubic-bezier(.5,.05,.2,1);}
  .bezel{background:#0c0e12;border-radius:14px;padding:12px 12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 0 0 1px #23262e;}
  .screen{position:relative;aspect-ratio:16/10;background:#fff;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px #000;}
  .screen iframe{width:100%;height:100%;border:0;display:block;}
  .cover{position:absolute;inset:0;z-index:6;cursor:zoom-in;background:linear-gradient(rgba(80,140,220,0),rgba(20,40,80,.08));display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;}
  .cover span{background:rgba(10,20,40,.72);color:#cfe4ff;font-size:12px;padding:4px 12px;border-radius:20px;opacity:0;transition:.2s;}
  .monitor:hover .cover span{opacity:1;}
  .stand{width:22%;height:5.5vh;margin:0 auto;background:linear-gradient(#1a1d24,#0c0e12);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);}
  .foot{width:34%;height:9px;margin:-2px auto 0;background:#0c0e12;border-radius:0 0 8px 8px;}
  .label{text-align:center;font-size:12px;color:#9fb0c8;margin-top:5px;} .label b{color:#cfe0f4;}
  body.zoomed #desk{gap:0;padding:0;}
  body.zoomed .monitor:not(.active){opacity:0;pointer-events:none;position:absolute;transform:scale(.6);}
  body.zoomed .monitor.active{width:100vw;max-width:none;}
  body.zoomed .monitor.active .stand,body.zoomed .monitor.active .foot,body.zoomed .monitor.active .label{display:none;}
  body.zoomed .monitor.active .cover{display:none;}
  body.zoomed .monitor.active .bezel{padding:0;border-radius:0;background:#000;box-shadow:none;}
  body.zoomed .monitor.active .screen{aspect-ratio:auto;height:calc(100vh - 34px);border-radius:0;}
  body.zoomed #tbUser,body.zoomed #tbSave{display:none;}
  #unzoom{position:fixed;top:4px;right:12px;z-index:50;display:none;background:#12385f;color:#cfe4ff;border:1px solid #2a5c8c;
    border-radius:7px;padding:5px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;}
  body.zoomed #unzoom{display:block;}
  button{font-family:inherit;cursor:pointer;}
  #toast{position:fixed;bottom:18px;right:18px;z-index:60;max-width:340px;background:#0d2038;color:#eaf2fb;
    border:1px solid #1d5a8c;border-left:4px solid #2f9be0;border-radius:9px;padding:11px 14px;font-size:12.5px;
    box-shadow:0 8px 26px rgba(0,0,0,.5);transform:translateX(120%);transition:transform .4s cubic-bezier(.3,1.2,.5,1);}
  #toast.on{transform:translateX(0);}

  /* ══ 업무 OS (앱 전환) ══ */
  #workos{position:absolute;inset:0;background:#eef1f5;color:#201f1e;font-size:13px;}
  .apppanel{position:absolute;inset:0 0 34px 0;display:none;flex-direction:column;overflow:hidden;}
  .apppanel.on{display:flex;}
  .taskbar{position:absolute;left:0;right:0;bottom:0;height:34px;background:#12233a;display:flex;align-items:stretch;z-index:5;}
  .taskbar button{flex:1;background:none;border:0;color:#bcd0e8;font-size:12px;position:relative;border-right:1px solid #0a1626;}
  .taskbar button.on{background:#1d3a5c;color:#fff;}
  .taskbar .badge{position:absolute;top:4px;right:22%;background:#e0503a;color:#fff;font-size:9px;border-radius:8px;padding:0 5px;}
  /* 아웃룩 */
  .ribbon{background:linear-gradient(#0f6cbd,#0a5aa0);color:#fff;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .ribbon .rtab{font-size:12px;opacity:.85;padding:2px 8px;border-radius:4px;} .ribbon .rtab.on{background:rgba(255,255,255,.18);opacity:1;}
  .ribbon .rbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:5px;padding:5px 10px;font-size:12px;} .ribbon .rspace{flex:1;}
  .olbody{flex:1;display:flex;min-height:0;}
  .folders{width:150px;flex:none;background:#faf9f8;border-right:1px solid #e1dfdd;padding:8px 0;overflow:auto;font-size:12.5px;}
  .folders .fg{color:#605e5c;font-size:11px;padding:6px 12px 2px;}
  .folders .f{padding:6px 12px;display:flex;justify-content:space-between;cursor:pointer;}
  .folders .f.on{background:#e1efff;border-left:3px solid #0f6cbd;font-weight:bold;} .folders .f .cnt{color:#0f6cbd;font-weight:bold;}
  .mlist{width:290px;flex:none;border-right:1px solid #e1dfdd;overflow:auto;background:#fff;}
  .mrow{padding:9px 11px;border-bottom:1px solid #f0eeec;cursor:pointer;border-left:3px solid transparent;}
  .mrow:hover{background:#f5f9ff;} .mrow.on{background:#e8f1fd;border-left-color:#0f6cbd;} .mrow.unread{border-left-color:#0f6cbd;}
  .mrow .m1{display:flex;justify-content:space-between;align-items:baseline;}
  .mrow .snd{font-weight:600;color:#201f1e;} .mrow.unread .snd{color:#0a5aa0;}
  .mrow .tm{font-size:11px;color:#888;flex:none;margin-left:6px;}
  .mrow .subj{font-size:12.5px;margin:2px 0;color:#1b1a19;} .mrow.unread .subj{font-weight:bold;}
  .mrow .prev{font-size:11.5px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin:3px 3px 0 0;}
  .tag.dg{background:#fde7e9;color:#a4262c;} .tag.rf{background:#e5f2fb;color:#0f6cbd;} .tag.fr{background:#fff4ce;color:#8a6d00;}
  .tag.hv{background:#eee;color:#555;} .tag.dl{background:#fce4ec;color:#b03060;}
  .reading{flex:1;overflow:auto;background:#fff;min-width:0;}
  .rdhead{padding:14px 18px;border-bottom:1px solid #edebe9;} .rdhead h2{margin:0 0 8px;font-size:17px;}
  .rdfrom{display:flex;align-items:center;gap:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:#0f6cbd;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex:none;}
  .rdfrom .fi{font-size:13px;} .rdfrom .fi .addr{color:#888;font-size:11.5px;} .rdfrom .rtime{margin-left:auto;color:#888;font-size:12px;}
  .rdbody{padding:16px 20px;line-height:1.8;font-size:13.5px;color:#252423;}
  .rdbody .att{margin-top:14px;padding-top:10px;border-top:1px solid #edebe9;}
  .att .file{display:inline-flex;align-items:center;gap:6px;background:#f3f2f1;border:1px solid #e1dfdd;border-radius:6px;padding:6px 10px;margin:3px 6px 3px 0;font-size:12px;}
  .actbtn{margin-top:14px;margin-right:8px;border:0;border-radius:7px;padding:10px 16px;font-size:13.5px;font-weight:bold;color:#fff;background:#0f6cbd;}
  .actbtn.green{background:#107c41;} .actbtn.amber{background:#b06a00;} .actbtn.done{background:#8a8886;}
  .actbtn.locked{background:#c8c6c4;cursor:not-allowed;}
  .rdempty{display:flex;height:100%;align-items:center;justify-content:center;color:#a19f9d;}
  /* 부킹 TMS */
  .tms{flex:1;overflow:auto;padding:12px 14px;background:#f6f8fb;}
  .tms h3{margin:0 0 3px;font-size:15px;} .tms .sub{color:#667;font-size:12px;margin-bottom:8px;}
  .bkrow{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid #dfe3ea;border-radius:9px;padding:8px 10px;margin:5px 0;cursor:pointer;}
  .bkrow.on{border-color:#0f6cbd;background:#f0f7ff;}
  .bkdot{width:12px;height:12px;border-radius:3px;flex:none;}
  .bkinfo{flex:1;font-size:12.5px;} .bkinfo .who{font-weight:bold;} .bkinfo .meta{color:#8a93a5;font-size:11px;}
  .bkrev{text-align:right;font-size:12.5px;font-weight:bold;color:#107c41;}
  .tmsfoot{position:sticky;bottom:0;background:#eaf0f8;border-top:1px solid #d5deea;padding:9px 12px;font-size:12.5px;}
  .capbar{height:8px;background:#dde3ec;border-radius:5px;overflow:hidden;margin:5px 0;}
  .capbar>div{height:100%;background:linear-gradient(90deg,#4a9e4a,#2f9be0);}
  .capbar>div.over{background:#e0503a;}
  .startbtn{display:block;width:100%;margin-top:8px;background:#e8734f;color:#fff;border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:bold;}
  .startbtn:disabled{background:#c8c6c4;}
  .negobtn{border:1px solid #0f6cbd;background:#fff;color:#0f6cbd;border-radius:6px;padding:6px 11px;font-size:12px;margin-bottom:6px;}
  .negobtn.on{background:#0f6cbd;color:#fff;}
  /* 서류 */
  .docs{flex:1;display:flex;flex-direction:column;background:#dfe3ea;}
  .doctabs{display:flex;background:#12233a;} .doctabs button{flex:1;background:none;border:0;color:#bcd0e8;padding:8px;font-size:12px;} .doctabs button.on{background:#e9edf3;color:#12233a;font-weight:bold;}
  .paper{flex:1;overflow:auto;padding:16px;}
  .sheet{max-width:640px;margin:0 auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:22px 26px;font-size:12.5px;color:#222;line-height:1.6;}
  .sheet h2{text-align:center;letter-spacing:2px;margin:0 0 4px;font-size:16px;} .sheet .co{text-align:center;color:#667;font-size:11px;margin-bottom:12px;}
  .sheet table{width:100%;border-collapse:collapse;margin:8px 0;} .sheet td,.sheet th{border:1px solid #cbd2dc;padding:5px 7px;font-size:11.5px;text-align:left;vertical-align:top;}
  .sheet th{background:#eef2f7;} .sheet .r{text-align:right;} .kv{display:flex;} .kv .k{width:130px;color:#667;flex:none;}
  /* 메신저 */
  .chat{flex:1;display:flex;flex-direction:column;background:#b2c7db;}
  .chathead{background:#12233a;color:#fff;padding:8px 12px;font-size:13px;font-weight:bold;}
  .chatbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .bub{max-width:75%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.5;}
  .bub.them{background:#fff;align-self:flex-start;border-top-left-radius:3px;}
  .bub.me{background:#fee500;align-self:flex-end;border-top-right-radius:3px;}
  .bub .nm{font-size:10.5px;color:#0a5aa0;font-weight:bold;margin-bottom:2px;} .bub .tm{font-size:9.5px;color:#999;margin-top:2px;text-align:right;}
</style>
</head>
<body>
<div id="topbar">
  <b>🚢 한바다 콘솔</b><span style="color:#8fa8c8">CFS 업무 PC</span>
  <span class="tspacer"></span>
  <span class="chip" id="tbUser">👤 김신입 · 신입</span>
  <span class="chip" id="tbSave">💰 저축 0만</span>
  <span class="chip" id="tbClock">🗓 월 08:00</span>
</div>

<div id="desk">
  <div class="monitor" id="mon1" data-mon="mon1">
    <div class="bezel"><div class="screen"><div id="workos">
      <!-- 📧 메일 -->
      <div class="apppanel on" id="app-mail">
        <div class="ribbon"><span style="font-weight:bold">📧 Outlook</span>
          <span class="rtab on">홈</span><span class="rtab">보내기/받기</span><span class="rtab">폴더</span><span class="rtab">보기</span>
          <span class="rspace"></span>
          <button class="rbtn" onclick="alert('데모: 답장은 추후')">↩ 답장</button>
          <button class="rbtn" onclick="delMail()">🗑 삭제</button>
        </div>
        <div class="olbody">
          <div class="folders">
            <div class="fg">폴더</div>
            <div class="f on" data-f="inbox">📥 받은편지함 <span class="cnt" id="cntInbox"></span></div>
            <div class="f" data-f="cargo">📦 화주</div>
            <div class="f" data-f="carrier">🚢 선사</div>
            <div class="f" data-f="customs">🏛 세관</div>
            <div class="f" data-f="trash">🗑 휴지통</div>
          </div>
          <div class="mlist" id="mlist"></div>
          <div class="reading" id="reading"><div class="rdempty">메일을 선택하세요</div></div>
        </div>
      </div>
      <!-- 📋 부킹 -->
      <div class="apppanel" id="app-booking"><div class="tms" id="tms"></div></div>
      <!-- 📄 서류 -->
      <div class="apppanel" id="app-docs"><div class="docs">
        <div class="doctabs">
          <button data-doc="bl" class="on" onclick="setDoc('bl')">📄 House B/L</button>
          <button data-doc="pl" onclick="setDoc('pl')">📦 Packing List</button>
          <button data-doc="ci" onclick="setDoc('ci')">💵 Invoice</button>
        </div>
        <div class="paper" id="paper"></div>
      </div></div>
      <!-- 💬 메신저 -->
      <div class="apppanel" id="app-chat"><div class="chat">
        <div class="chathead">💬 사내 메신저 · 박현우 팀장 / 콘솔데스크</div>
        <div class="chatbody" id="chatbody"></div>
      </div></div>
      <div class="taskbar" id="taskbar">
        <button data-app="mail" class="on">📧 메일<span class="badge" id="bMail"></span></button>
        <button data-app="booking">📋 부킹<span class="badge" id="bBook"></span></button>
        <button data-app="docs">📄 서류</button>
        <button data-app="chat">💬 메신저<span class="badge" id="bChat"></span></button>
      </div>
    </div></div></div>
    <div class="cover"><span>🔍 클릭하면 크게 봅니다</span></div>
    <div class="stand"></div><div class="foot"></div>
    <div class="label">모니터 1 · <b>업무 시스템</b> (메일·부킹·서류·메신저)</div>
  </div>

  <div class="monitor" id="mon2" data-mon="mon2">
    <div class="bezel"><div class="screen"><iframe id="game" src="cargo.html" title="적재 작업"></iframe></div></div>
    <div class="cover"><span>🔍 클릭하면 크게 봅니다</span></div>
    <div class="stand"></div><div class="foot"></div>
    <div class="label">모니터 2 · <b>적재 작업</b> (CFS 3D)</div>
  </div>
</div>

<button id="unzoom" onclick="unzoom()">⊟ 두 화면 보기</button>
<div id="toast"></div>

<script>
const RANKS=['신입','대리','과장','팀장','부사장'];
const CARGO_KO={carton:'카톤박스📦',pallet:'팔레트🟫',drum:'드럼(위험물)🛢',ibc:'IBC탱크🧴',bigbag:'톤백🛍',crate:'목상자🪵',pipe:'강관⛓',glass:'판유리⚠️',machine:'기계장비⚙️',frozen:'냉동식품❄️',produce:'청과🥬'};
function prog(){ try{return JSON.parse(localStorage.getItem('cargo_progress')||'{}');}catch(e){return {};} }
function game(){ return document.getElementById('game').contentWindow; }
function gameReady(){ try{return !!game().wsStageInfo;}catch(e){return false;} }
const POD={상하이:'CNSHA',싱가포르:'SGSIN',도쿄:'JPTYO',로스앤젤레스:'USLAX',두바이:'AEJEA',로테르담:'NLRTM'};

// ── 메일 데이터 ──
const EMAILS=[
  {id:1,folder:'inbox',from:'박현우 팀장',addr:'hw.park@hanbada.co.kr',subj:'[지시] 이번 주 콘솔 스케줄 · 실적 관리',tm:'월 08:12',unread:true,
   body:`김 사원, 이번 주 부산발 콘솔 6건 잡혔다. <b>📋 부킹</b> 탭에서 화주를 골라 접수하고 <b>적재 시작</b>을 눌러라.<br><br>핵심은 <b>채움율과 무클레임</b>. 위험물·냉장·파손 메일 잘 읽고 판단해. — 박현우`},
  {id:2,folder:'inbox',from:'한빛무역 김영수',addr:'ys.kim@hanbit.com',subj:'[부킹요청] 부산→상하이 LCL (9월 3주 수 출항)',tm:'월 09:40',unread:true,stage:0,tags:['fr','dl'],
   body:`상하이행 LCL 부킹 요청드립니다.<br>• 카톤·판유리(<b>⚠️ 상단 적재 금지</b>)·팔레트·톤백·IBC 등, 삼진화학 <b>위험물 드럼</b> 포함<br>• <b>출항 마감: 9월 3주 수</b> · 무손상 필수<br>※ <b>📋 부킹 탭</b>에서 고R.T 위주로 골라 담아주세요.`,att:['상하이_콘솔명세.xlsx']},
  {id:3,folder:'inbox',from:'삼진화학 안전팀',addr:'safety@samjin-chem.co.kr',subj:'[위험물] UN1263 드럼 3본 · MSDS 및 격리 요망',tm:'월 10:05',unread:true,tags:['dg'],
   body:`위험물 신고 자료입니다.<br>• <b>UN1263, Class 3</b> 200L 드럼 3본<br>• <b>격리</b>: 식품 인접 금지, 드럼 위 적재 금지, 바닥 단 적재.<br>격리 위반 시 검수 반려·벌금.`,att:['MSDS_UN1263.pdf','위험물신고서.pdf']},
  {id:4,folder:'inbox',from:'대양상사 무역부',addr:'trade@daeyang.com',subj:'[부킹요청] 부산→싱가포르 40ft 콘솔 (9월 3주 토)',tm:'화 09:15',unread:true,stage:1,tags:['dg','hv'],
   body:`싱가포르행 40ft 대형 콘솔. 기계·IBC 중량물 다수.<br>• <b>🔩 중량 좌우·앞뒤 균형</b>(전복 방지). 손상 1개 허용.<br>• 위험물·판유리 포함. 꽉 채울수록 R.T 매출↑.`,att:['싱가포르_패킹리스트.xlsx']},
  {id:5,folder:'inbox',from:'신선물류 콜드체인',addr:'cold@ssmulyu.co.kr',subj:'[냉장/냉동] 부산→도쿄 리퍼 — 온도 엄수!',tm:'화 11:30',unread:true,stage:2,tags:['rf','dl'],
   body:`도쿄행 리퍼. <b style="color:#a4262c">온도가 생명입니다.</b><br>• 리퍼는 <b>설정온도 하나뿐</b> — 냉동(-18℃)+냉장(+4℃) 혼적 시 청과 동해(전량 클레임).<br>• 우리는 <b>냉장 청과</b>, 오션델리·대양수산·한류수산은 <b>냉동</b>. <b>한 온도만</b> 고르세요.`,att:['콜드체인_기준.pdf']},

      <div class="bkinfo"><span class="who">${b.who}</span> ${on?'✅':'⬜'}<br><span class="meta">${b.count}개 · ${b.rt} R.T · ${fl.join(' ')||'일반'}</span></div>
      <div class="bkrev">$${Math.round(b.rt*eRate)}</div></div>`;

      <button class="startbtn" ${accItems===0?'disabled':''} onclick="beginWork()">🖥️ ${accItems}개 적재 시작 → 오른쪽 모니터</button>
    </div>`;
}

      <table><tr><th>Shipper</th><th>Cargo</th><th class="r">Pkgs</th><th class="r">CBM</th><th class="r">R.T</th></tr>
      ${sel.map(b=>`<tr><td>${b.who}</td><td>${b.cargo.map(c=>CARGO_KO[c]||c).join(', ')}</td><td class="r">${b.count}</td><td class="r">${b.cbm}</td><td class="r">${b.rt}</td></tr>`).join('')}
      <tr><th>합계</th><th></th><th class="r">${totPkg}</th><th class="r">${totCBM}</th><th class="r">${totRT}</th></tr></table></div>`;
  } else {
    el.innerHTML=`<div class="sheet"><h2>FREIGHT INVOICE</h2>${head}
      <table><tr><th>Shipper</th><th class="r">R.T</th><th class="r">Rate(USD)</th><th class="r">Amount(USD)</th></tr>
      ${sel.map(b=>`<tr><td>${b.who}</td><td class="r">${b.rt}</td><td class="r">$${Math.round(rate)}</td><td class="r">$${Math.round(b.rt*rate)}</td></tr>`).join('')}
      <tr><th>Ocean Freight</th><th class="r">${totRT}</th><th></th><th class="r">$${amount}</th></tr></table>
      <div class="kv"><div class="k">Box Cost (선사)</div><div>- $${info.box}</div></div>
      <p style="margin-top:8px;color:#888;font-size:11px">※ 혼재 마진 = 화주 청구합계 − 박스 매입가 − 부대비. 실제 정산은 적재 결과에 따름.</p></div>`;
  }
}

// ── 💬 메신저 ──
function pushChat(who,text,me){ chat.push({who,text,me,tm:clockStr()}); if(!me&&curApp!=='chat') chatUnread++; if(curApp==='chat') renderChat(); setBadge('bChat',chatUnread); }
function renderChat(){
  chatUnread=0; setBadge('bChat',0);
  document.getElementById('chatbody').innerHTML=chat.map(c=>
    `<div class="bub ${c.me?'me':'them'}">${c.me?'':`<div class="nm">${c.who}</div>`}${c.text}<div class="tm">${c.tm}</div></div>`).join('')
    ||'<div style="text-align:center;color:#567;margin-top:20px">메시지가 여기 표시됩니다</div>';
  const b=document.getElementById('chatbody'); b.scrollTop=b.scrollHeight;
}

// ── 앱 전환 ──
function switchApp(name){ curApp=name;
  document.querySelectorAll('.apppanel').forEach(p=>p.classList.toggle('on',p.id==='app-'+name));
  document.querySelectorAll('.taskbar button').forEach(b=>b.classList.toggle('on',b.dataset.app===name));
  if(name==='booking') renderBooking(); if(name==='docs') renderDocs(); if(name==='chat') renderChat();
}
document.querySelectorAll('.taskbar button').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); switchApp(b.dataset.app); }));
function setBadge(id,n){ const el=document.getElementById(id); if(el) el.textContent=n>0?n:''; }

// ── 게임 → 셸 콜백 (결과 통지) ──
window.wsOnResult=(idx,res)=>{
  if(res.pass){ toast(`✅ <b>Stage ${idx+1} 완료</b> · 마진 ${res.margin}만 · ${'★'.repeat(res.stars)}`);
    pushChat('박현우 팀장',`Stage ${idx+1} 처리 확인. 마진 ${res.margin}만, ${res.dmg===0?'무손상 좋아.':'손상 있었지만 통과.'}${res.promoted?` 그리고 <b>${res.promoted} 승진</b> 축하한다! 🎉`:''}`);
    bkIdx=-1; accSel=new Set();   // 다음 건으로
    if(res.last) pushChat('박현우 팀장','이번 주 전건 완료. 자네 이제 부사장이야. 언젠가 자기 회사를 열 날이 오겠지. — 박현우');
  } else { toast(`❌ Stage ${idx+1} 목표 미달 — 다시 시도`);
    pushChat('박현우 팀장',`Stage ${idx+1} 미달이다. 고R.T·저리스크로 다시 골라봐.`); }
  refresh();
};

// ── 모니터 줌 ──
function zoom(id){ document.querySelectorAll('.monitor').forEach(m=>m.classList.toggle('active',m.id===id)); document.body.classList.add('zoomed');
  setTimeout(()=>{ try{game().dispatchEvent(new Event('resize'));}catch(e){} },480); }
function unzoom(){ document.body.classList.remove('zoomed'); document.querySelectorAll('.monitor').forEach(m=>m.classList.remove('active'));
  setTimeout(()=>{ try{game().dispatchEvent(new Event('resize'));}catch(e){} },480); }
document.querySelectorAll('.cover').forEach(c=>c.addEventListener('click',()=>zoom(c.closest('.monitor').id)));

// ── ⏱ 시뮬 시계 + 스케줄러 ──
EMAILS.forEach(m=>{ m.at=SCHED[m.id]??0; m.shown=(m.at<=0); });
let simMin=0; const SPEED=5; const DAYS=['월','화','수','목','금','월','화','수'];
function clockStr(){ const day=Math.floor(simMin/600),mi=simMin%600,h=8+Math.floor(mi/60),m=mi%60; return `${DAYS[day]||'월'} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
let toastT; function toast(msg){ const el=document.getElementById('toast'); el.innerHTML=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),3600); }
function reveal(m){ if(m.shown)return; m.shown=true; m.unread=true; toast(`📧 <b>새 메일</b> · ${m.from}<br>${m.subj}`); }
let lateFired={};
function refresh(){
  const p=prog(), r=RANKS[p.rankIdx||0]||'신입';
  document.getElementById('tbUser').textContent=`👤 김신입 · ${r}`;
  document.getElementById('tbSave').textContent=`💰 저축 ${p.savings||0}만`;
  document.getElementById('tbClock').textContent=`🗓 ${clockStr()}`;
  const busy=document.body.classList.contains('zoomed')&&document.getElementById('mon2').classList.contains('active');
  if(curApp==='mail'){ if(curMail!=null){ const m=EMAILS.find(x=>x.id===curMail); if(m) openMail(curMail); else renderList(); } else renderList(); }
  else if(curApp==='booking'&&!busy) renderBooking();
  else if(curApp==='docs'&&!busy) renderDocs();
}
function tick(){
  simMin+=SPEED;
  EMAILS.forEach(m=>{ if(!m.shown&&simMin>=m.at) reveal(m); });
  const c=(prog().cleared)??0;
  EMAILS.forEach(m=>{ if(!m.shown&&m.stage!=null&&m.stage<=c) reveal(m); });
  // ⏰ 현재 건 마감 초과 → 지연 위약금
  if(c<6 && simMin>DL[c] && !lateFired[c] && gameReady()){ lateFired[c]=true; game().wsMods.late[c]=true;
    toast(`⏰ <b>마감 초과</b> · Stage ${c+1} 지연 위약금(30만) 적용`); pushChat('박현우 팀장',`Stage ${c+1} 마감 넘겼다. 지연 위약금 물게 생겼어. 서둘러.`); }
  refresh();
}
setInterval(tick,1000); window.addEventListener('focus',refresh);
// 초기
pushChat('박현우 팀장','출근했나? 받은편지함부터 확인하고, 📋 부킹 탭에서 첫 건 접수해. 화이팅.');
renderList(); openMail(1); refresh();
</script>
</body>
</html>
